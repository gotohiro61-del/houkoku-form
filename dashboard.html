<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>現場運営ダッシュボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;background:#f0f2f5;color:#333;min-height:100vh;-webkit-text-size-adjust:100%}
.container{max-width:480px;margin:0 auto;padding:12px;padding-bottom:100px}

/* Loading */
#loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#1a5276;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:16px;font-size:14px;color:#888}

/* Header */
.header{background:linear-gradient(135deg,#0d1b2a,#1b2838);color:#fff;padding:18px 16px;border-radius:16px;margin-bottom:14px;text-align:center}
.header h1{font-size:17px;font-weight:700}
.header .badge{display:inline-block;background:rgba(255,255,255,.2);padding:4px 14px;border-radius:20px;font-size:13px;margin-top:6px}

/* Section */
.section{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.section-title{font-size:15px;font-weight:700;color:#1a5276;margin-bottom:14px;display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:2px solid #e0edf5}

/* Date Filter */
.date-nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.date-btn{flex-shrink:0;padding:10px 16px;border:2px solid #e0e0e0;border-radius:24px;background:#fafafa;font-size:14px;font-weight:700;color:#666;cursor:pointer;transition:all .15s}
.date-btn.active{border-color:#1a5276;background:#e0edf5;color:#1a5276}
.date-btn:first-child{border-color:#e74c3c;color:#c0392b}
.date-btn:first-child.active{background:#fdecea;border-color:#c0392b;color:#c0392b}

/* Venue Card */
.venue-card{background:#fff;border:2px solid #e0e0e0;border-radius:16px;padding:18px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s;display:flex;justify-content:space-between;align-items:center}
.venue-card:active{transform:scale(.98);background:#f8f9fa}
.venue-card .venue-info{flex:1}
.venue-card .venue-name{font-size:16px;font-weight:700;margin-bottom:4px}
.venue-card .venue-meta{font-size:13px;color:#666}
.venue-card .venue-status{font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px;white-space:nowrap}
.venue-card .venue-status.done{background:#e8f5e9;color:#2e7d32}
.venue-card.venue-done{background:#f5f5f5;border-color:#ccc}
.venue-card.venue-done .venue-name{color:#999}
.venue-card .venue-arrow{font-size:18px;color:#bbb;margin-left:8px}

/* Back button */
.back-btn{display:inline-flex;align-items:center;gap:4px;color:#1a5276;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;padding:10px 0;background:none;border:none}
.back-btn:active{opacity:.6}

/* Tournament Card */
.tournament-card{background:#fff;border:2px solid #e0e0e0;border-radius:16px;padding:18px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:14px}
.tournament-card:active{transform:scale(.98);background:#f8f9fa}
.tournament-card .tc-time{font-size:22px;font-weight:800;color:#1a5276;white-space:nowrap;min-width:60px}
.tournament-card .tc-info{flex:1}
.tournament-card .tc-name{font-size:15px;font-weight:700}
.tournament-card .tc-sub{font-size:13px;color:#888;margin-top:2px}
.tournament-card .tc-arrow{font-size:20px;color:#bbb}

/* History */
.history-card{background:#fff;border:1.5px solid #e0e0e0;border-radius:12px;padding:12px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.history-card .hc-info{flex:1}
.history-card .hc-time{font-size:12px;color:#888}
.history-card .hc-team{font-size:14px;font-weight:700}
.history-card .hc-detail{font-size:12px;color:#666}
.history-card .hc-status{display:flex;gap:4px;align-items:center}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-dot.ok{background:#27ae60}
.status-dot.ng{background:#e74c3c}
.resend-btn{padding:6px 12px;background:#e74c3c;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.resend-btn:active{opacity:.7}
.resend-btn:disabled{opacity:.4}

/* Team Card */
.team-card{background:#fff;border-left:5px solid #ccc;border-radius:12px;padding:14px 14px 14px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.team-card:active{transform:scale(.98)}
.team-card.status-paid{border-left-color:#27ae60}
.team-card.status-transfer{border-left-color:#f39c12}
.team-card.status-unpaid{border-left-color:#e74c3c}
.team-card .tc-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.team-card .tc-team-name{font-size:16px;font-weight:800}
.team-card .tc-app-no{font-size:11px;color:#999;background:#f0f0f0;padding:2px 8px;border-radius:8px}
.team-card .tc-row2{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.team-card .tc-rep{font-size:13px;color:#555}
.team-card .tc-phone{font-size:13px;color:#1a5276;font-weight:600}
.team-card .tc-row3{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.team-card .tc-rental{font-size:12px;color:#e67e22;background:#fef5e7;padding:2px 8px;border-radius:8px}
.team-card .tc-price{font-size:14px;font-weight:800;color:#1a5276}
.team-card .tc-pay-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px}
.tc-pay-status.paid{background:#e8f5e9;color:#2e7d32}
.tc-pay-status.transfer{background:#fef9e7;color:#d68910}
.tc-pay-status.unpaid{background:#fdecea;color:#c0392b}
.tc-pay-status.unknown{background:#f0f0f0;color:#999}
.team-card .tc-sales-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:#e8f0fe;color:#1a73e8}

/* Bottom Sheet */
.bs-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:500;animation:fadeIn .2s}
.bs-overlay.show{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:#fff;border-radius:20px 20px 0 0;z-index:501;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;padding-bottom:env(safe-area-inset-bottom,20px)}
.bottom-sheet.show{transform:translateY(0)}
.bs-handle{width:40px;height:5px;background:#ddd;border-radius:3px;margin:10px auto}
.bs-header{display:flex;justify-content:space-between;align-items:flex-start;padding:0 20px 16px}
.bs-close{width:36px;height:36px;background:#f0f0f0;border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bs-team-name{font-size:20px;font-weight:800;flex:1}
.bs-section{padding:0 20px 16px}
.bs-section-title{font-size:13px;font-weight:700;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.bs-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bs-info-item{background:#f8f9fa;border-radius:10px;padding:10px 12px}
.bs-info-label{font-size:11px;color:#888;margin-bottom:2px}
.bs-info-value{font-size:14px;font-weight:700}
.bs-divider{height:1px;background:#eee;margin:0 20px 16px}
.bs-form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bs-form-group{margin-bottom:10px}
.bs-form-group label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:4px}
.bs-form-group select,.bs-form-group input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;background:#fafafa;font-family:inherit;-webkit-appearance:none}
.bs-form-group select:focus,.bs-form-group input:focus{outline:none;border-color:#1a5276;background:#fff}
.bs-cash-box{background:#fff8e1;border:2px solid #ffc107;border-radius:14px;padding:14px;margin:0 20px 16px}
.bs-cash-box .cash-label{font-size:13px;font-weight:700;color:#f57f17;margin-bottom:8px}
.bs-cash-row{display:flex;gap:10px;align-items:center}
.bs-cash-row input{flex:1;padding:12px;border:2px solid #e0c860;border-radius:10px;font-size:18px;font-weight:700;background:#fff;font-family:inherit}
.bs-cash-confirm{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:15px;font-weight:700;color:#2e7d32;cursor:pointer}
.bs-cash-confirm input[type=checkbox]{width:22px;height:22px;accent-color:#2e7d32}
.bs-actions{padding:0 20px 20px;display:flex;flex-direction:column;gap:8px}
.btn-save{width:100%;padding:16px;background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
.btn-save:active{opacity:.8}
.btn-save:disabled{opacity:.4}
.btn-sokketsu{width:100%;padding:16px;background:linear-gradient(135deg,#e65100,#ff6d00);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-sokketsu:active{opacity:.8}

/* Report */
.report-btn{width:100%;padding:18px;background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;letter-spacing:1px}
.report-btn:active{opacity:.8}
.report-btn:disabled{opacity:.4}

/* Form elements */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:700;color:#444;margin-bottom:6px}
.form-group label .req{color:#d32f2f;font-size:11px;margin-left:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;background:#fafafa;transition:border-color .2s;-webkit-appearance:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#2980b9;background:#fff}
.form-group textarea{resize:vertical;min-height:100px;line-height:1.6}

/* Staff */
.normal-work-setting{background:#f0f4f8;border-radius:12px;padding:14px;margin-bottom:14px}
.normal-work-setting .setting-title{font-size:13px;font-weight:700;color:#1a5276;margin-bottom:10px}
.normal-work-inputs{display:grid;grid-template-columns:1fr 1fr 80px;gap:8px;margin-bottom:10px}
.normal-work-inputs input{width:100%;padding:10px 8px;border:2px solid #b0cfe0;border-radius:10px;font-size:15px;background:#fff;text-align:center;font-family:inherit;-webkit-appearance:none}
.normal-work-inputs input:focus{outline:none;border-color:#2980b9}
.nw-label{font-size:10px;color:#666;text-align:center;margin-bottom:2px}
.apply-all-btn{width:100%;padding:12px;background:#2980b9;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.apply-all-btn:active{opacity:.8}
.staff-entry{border:1.5px solid #eee;border-radius:12px;padding:10px 12px;margin-bottom:6px;background:#fafbfc;transition:all .2s}
.staff-entry.has-name{border-color:#b0cfe0;background:#f8fbfd}
.staff-entry .staff-row-top{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center}
.staff-entry .staff-num{font-size:12px;font-weight:700;color:#999;text-align:center}
.staff-entry select{width:100%;padding:8px 10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;background:#fff;font-family:inherit}
.staff-entry select:focus{outline:none;border-color:#2980b9}
.staff-row-bottom{display:grid;grid-template-columns:1fr 1fr 70px;gap:6px;margin-top:8px}
.staff-row-bottom.collapsed{display:none}
.staff-row-bottom input{width:100%;padding:8px 6px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;text-align:center;background:#fff;font-family:inherit}
.staff-row-bottom input:focus{outline:none;border-color:#2980b9}
.staff-field-label{font-size:10px;color:#888;text-align:center;margin-bottom:2px}
.nw-toggle{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;font-weight:700;color:#999;white-space:nowrap;-webkit-user-select:none;user-select:none}
.nw-toggle input{display:none}
.nw-toggle .switch{width:36px;height:20px;background:#ddd;border-radius:10px;position:relative;transition:background .2s}
.nw-toggle .switch::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.nw-toggle input:checked+.switch{background:#2980b9}
.nw-toggle input:checked+.switch::after{transform:translateX(16px)}

/* Check items */
.check-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:15px}
.check-item:last-child{border-bottom:none}
.check-item input[type=checkbox]{width:24px;height:24px;accent-color:#2980b9;flex-shrink:0}
.check-item label{flex:1;cursor:pointer}

/* Confirm overlay */
.confirm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:600;padding:16px;overflow-y:auto}
.confirm-overlay.show{display:flex;justify-content:center;align-items:flex-start}
.confirm-box{background:#fff;border-radius:20px;padding:24px 20px;max-width:440px;width:100%;margin:auto}
.confirm-title{font-size:18px;font-weight:800;text-align:center;color:#1a5276;margin-bottom:16px}
.confirm-section{background:#f8f9fa;border-radius:12px;padding:14px;margin-bottom:10px}
.confirm-section-title{font-size:13px;font-weight:700;color:#1a5276;margin-bottom:8px}
.confirm-item{font-size:13px;color:#555;padding:3px 0}
.confirm-buttons{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.confirm-back-btn{width:100%;padding:14px;background:#fff;color:#999;border:2px solid #e0e0e0;border-radius:14px;font-size:14px;cursor:pointer}
.confirm-send-btn{width:100%;padding:16px;background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
.confirm-send-btn:active{opacity:.8}
.confirm-send-btn:disabled{opacity:.4}

/* Done */
.done-screen{text-align:center;padding:60px 20px}
.done-check{width:80px;height:80px;background:#27ae60;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:40px;color:#fff;margin-bottom:20px}
.done-title{font-size:22px;font-weight:800;margin-bottom:8px}
.done-subtitle{color:#888;font-size:14px;margin-bottom:4px}
.done-error{background:#fdecea;color:#c0392b;padding:12px;border-radius:10px;font-size:14px;margin-top:12px}
.done-btn{margin-top:24px;padding:16px 40px;background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}

/* Booking form */
.booking-block{border:2px solid #e8eaed;border-radius:16px;padding:18px 14px 14px;margin-bottom:12px;position:relative;background:#fafbfc}
.booking-number{position:absolute;top:-11px;left:14px;background:#e65100;color:#fff;font-size:13px;font-weight:700;padding:3px 14px;border-radius:12px}
.copy-check{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;background:#fff3e0;border-radius:10px;font-size:14px;color:#e65100;font-weight:600;cursor:pointer}
.copy-check input[type=checkbox]{width:20px;height:20px;accent-color:#e65100}
.slot-payment{border-top:2px dashed #e0e0e0;margin-top:14px;padding:14px;background:#fffdf5;margin:-14px;margin-top:14px;border-radius:0 0 14px 14px}
.rental-section{border-top:1px solid #eee;margin-top:10px;padding-top:10px}
.rental-title{font-size:13px;font-weight:700;color:#555;margin-bottom:8px}
.rental-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.rental-item:last-child{border-bottom:none}
.rental-item .rental-label{flex:1}
.rental-item select{padding:6px 8px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;background:#fff;-webkit-appearance:none}
.slot-summary{border-top:2px solid #e0e0e0;margin-top:10px;padding-top:10px}
.slot-summary .summary-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#555}
.slot-summary .summary-row.rental{color:#e67e22}
.slot-summary .summary-row.discount{color:#d32f2f}
.slot-summary .rental-detail{font-size:11px;color:#999;padding:0 0 4px 8px}
.slot-summary .summary-total{display:flex;justify-content:space-between;padding:8px 0 0;margin-top:4px;border-top:2px solid #e65100;font-size:17px;font-weight:800;color:#e65100}
.grand-total-box{background:linear-gradient(135deg,#e65100,#ff6d00);border-radius:16px;padding:18px;color:#fff;margin-bottom:12px}
.grand-total-box .gt-title{font-size:13px;opacity:.8;margin-bottom:4px}
.grand-total-box .gt-breakdown{font-size:13px;opacity:.9;padding:4px 0}
.grand-total-box .gt-amount{font-size:28px;font-weight:800;text-align:center;padding:8px 0}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-selector{display:flex;gap:8px;margin-bottom:14px}
.type-btn{flex:1;padding:14px 4px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;font-size:16px;font-weight:700;text-align:center;cursor:pointer}
.type-btn.selected{border-color:#e65100;background:#e65100;color:#fff}

/* Cancel toggle */
.cancel-toggle-row{margin-bottom:10px;padding:6px 0}
.cancel-toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#c0392b;cursor:pointer}
.cancel-toggle input{width:20px;height:20px;accent-color:#c0392b}
.cancelled-badge{background:#fdecea;color:#c0392b;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px}
.teams-disabled{opacity:.4;pointer-events:none}

/* Utility */
.hidden{display:none!important}
.text-sm{font-size:13px}
.text-center{text-align:center}
.text-red{color:#c0392b}
.mb-12{margin-bottom:12px}
.error-banner{background:#fdecea;color:#c0392b;padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:12px;display:none}
.error-banner.show{display:block}
.empty-state{text-align:center;color:#999;padding:30px;font-size:14px}

/* Sokketsu confirm overlay (reuse) */
.rep-confirm-box{background:#fff3e0;border:2px solid #ff9800;border-radius:14px;padding:18px;margin-bottom:16px;text-align:center}
.rep-confirm-box .rep-title{font-size:13px;color:#e65100;font-weight:700;margin-bottom:10px}
.rep-confirm-box .rep-name{font-size:20px;font-weight:800;margin-bottom:4px}
.rep-confirm-box .rep-email{font-size:14px;color:#666;word-break:break-all}
.btn-send-sokketsu{width:100%;padding:18px;border:none;border-radius:14px;background:linear-gradient(135deg,#e65100,#ff6d00);color:#fff;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px}
.btn-send-sokketsu:disabled{opacity:.4}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">データを読み込み中...</div>
</div>

<!-- Confirm Overlay (Report) -->
<div class="confirm-overlay" id="report-confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">この内容で報告しますか？</div>
    <div id="report-confirm-body"></div>
    <div class="confirm-buttons">
      <button class="confirm-back-btn" onclick="closeReportConfirm()">戻って修正</button>
      <button class="confirm-send-btn" id="report-send-btn" onclick="doSubmitReport()">報告を送信</button>
    </div>
  </div>
</div>

<!-- Confirm Overlay (Sokketsu) -->
<div class="confirm-overlay" id="sokketsu-confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">この内容で送信しますか？</div>
    <div class="rep-confirm-box">
      <div class="rep-title">この代表者に確認メールを送信します</div>
      <div class="rep-name" id="sk-confirm-rep">-</div>
      <div class="rep-email" id="sk-confirm-email">-</div>
    </div>
    <div id="sokketsu-confirm-body"></div>
    <div class="confirm-buttons">
      <button class="confirm-back-btn" onclick="closeSokketsuConfirm()">戻って修正</button>
      <button class="btn-send-sokketsu" id="sokketsu-send-btn" onclick="doSubmitSokketsu()">送信する</button>
    </div>
  </div>
</div>

<!-- Bottom Sheet Overlay -->
<div class="bs-overlay" id="bs-overlay" onclick="closeBottomSheet()"></div>
<div class="bottom-sheet" id="bottom-sheet">
  <div class="bs-handle"></div>
  <div id="bs-content"></div>
</div>

<div class="container">
  <div class="header">
    <h1>現場運営ダッシュボード</h1>
    <div class="badge" id="today-display">-</div>
  </div>

  <div class="error-banner" id="error-banner"></div>

  <!-- ===== Screen 1: Venue Selection ===== -->
  <div id="screen-venue-select">
    <div class="section">
      <div class="section-title">&#x1F3DF; 会場を選択</div>
      <div class="date-nav" id="date-nav">
        <button class="date-btn" onclick="filterVenues('unreported')">未報告</button>
        <button class="date-btn" onclick="filterVenues('yesterday')">前日</button>
        <button class="date-btn active" onclick="filterVenues('today')">本日</button>
        <button class="date-btn" onclick="filterVenues('tomorrow')">翌日</button>
      </div>
      <div id="venue-list">
        <p class="empty-state">読み込み中...</p>
      </div>
    </div>
  </div>

  <!-- ===== Screen 2: Venue Dashboard ===== -->
  <div id="screen-venue-dashboard" class="hidden">
    <button class="back-btn" onclick="goVenueSelect()">&#x2190; 会場選択に戻る</button>

    <div class="section">
      <div class="section-title" id="venue-title">&#x1F3C0; 大会一覧</div>
      <div id="tournament-list"></div>
    </div>

    <div class="section" id="history-section">
      <div class="section-title">&#x1F4D2; 本日の即決予約</div>
      <div id="history-list">
        <p class="empty-state">読み込み中...</p>
      </div>
    </div>

    <button class="report-btn" onclick="goReport()">&#x1F4CB; 報告を入力する</button>
  </div>

  <!-- ===== Screen 3: Team List ===== -->
  <div id="screen-team-list" class="hidden">
    <button class="back-btn" onclick="goVenueDashboard()">&#x2190; 大会一覧に戻る</button>

    <div class="section">
      <div class="section-title" id="team-list-title">-</div>
      <div id="team-list"></div>
    </div>
  </div>

  <!-- ===== Screen 4: Sokketsu Booking Form ===== -->
  <div id="screen-sokketsu" class="hidden">
    <button class="back-btn" onclick="goTeamList()">&#x2190; チーム一覧に戻る</button>

    <div class="header" style="background:linear-gradient(135deg,#e65100,#ff6d00)">
      <h1>&#x26A1; 即決予約</h1>
      <div class="badge" id="sk-team-badge">-</div>
    </div>

    <div class="section">
      <div class="section-title">&#x1F3C0; チーム情報</div>
      <div class="bs-info-grid">
        <div class="bs-info-item"><div class="bs-info-label">チーム</div><div class="bs-info-value" id="sk-disp-team">-</div></div>
        <div class="bs-info-item"><div class="bs-info-label">代表者</div><div class="bs-info-value" id="sk-disp-rep">-</div></div>
        <div class="bs-info-item"><div class="bs-info-label">電話番号</div><div class="bs-info-value" id="sk-disp-phone">-</div></div>
        <div class="bs-info-item"><div class="bs-info-label">メール</div><div class="bs-info-value" id="sk-disp-email" style="font-size:11px;word-break:break-all">-</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">&#x1F522; 何枠の即決？</div>
      <div class="type-selector" id="sk-type-selector"></div>
    </div>

    <div class="section">
      <div class="section-title">&#x1F4C5; 予約内容を入力</div>
      <div class="form-group">
        <label>入力者名 <span class="req">必須</span></label>
        <input type="text" id="sk-staff-name" placeholder="あなたの名前">
      </div>
      <div id="sk-booking-slots"></div>
    </div>

    <div class="grand-total-box" id="sk-total-section">
      <div class="gt-title">お支払い合計</div>
      <div id="sk-total-breakdown"></div>
      <div class="gt-amount" id="sk-grand-total">-</div>
    </div>

    <button class="btn-sokketsu" onclick="showSokketsuConfirm()">確認画面へ</button>
    <button class="confirm-back-btn" style="margin-top:8px" onclick="goTeamList()">キャンセル</button>
  </div>

  <!-- ===== Screen 5: Report Form ===== -->
  <div id="screen-report" class="hidden">
    <button class="back-btn" onclick="goVenueDashboard()">&#x2190; ダッシュボードに戻る</button>

    <div class="section">
      <div class="section-title">&#x1F4CB; 報告者</div>
      <div class="form-group" style="margin-bottom:0">
        <label>報告者名 <span class="req">必須</span></label>
        <input type="text" id="report-staff-name" placeholder="あなたの名前">
      </div>
    </div>

    <!-- 運営報告（チーム営業/順位/備考） -->
    <div class="section">
      <div class="section-title">&#x1F3C0; 運営報告</div>
      <div id="report-blocks-area"></div>
    </div>

    <!-- スタッフ勤務 -->
    <div class="section">
      <div class="section-title">&#x1F464; スタッフ勤務</div>
      <div class="normal-work-setting">
        <div class="setting-title">通常勤務の時間</div>
        <div class="normal-work-inputs">
          <div><div class="nw-label">出勤</div><input type="time" id="nw-start" value="09:00"></div>
          <div><div class="nw-label">退勤</div><input type="time" id="nw-end" value="18:00"></div>
          <div><div class="nw-label">休憩(分)</div><input type="number" id="nw-break" value="60" min="0" step="15"></div>
        </div>
        <button class="apply-all-btn" onclick="applyAllNormal()">全員に通常勤務を適用</button>
      </div>
      <div id="staff-area"></div>
    </div>

    <!-- 現場報告 -->
    <div class="section">
      <div class="section-title">&#x1F4DD; 現場報告</div>
      <div class="form-group">
        <label>&#x26A0;&#xFE0F; アクシデント報告</label>
        <textarea id="accident-report" placeholder="事故・怪我・トラブル等あれば記入"></textarea>
      </div>
      <div class="form-group">
        <label>&#x1F4CB; その他報告</label>
        <textarea id="other-report" placeholder="連絡事項・気になった点など"></textarea>
      </div>
    </div>

    <!-- チェックリスト -->
    <div class="section">
      <div class="section-title">&#x2705; 大会運営最終チェック</div>
      <div id="check-items-area"></div>
    </div>

    <button class="report-btn" onclick="showReportConfirm()">完了報告を送信</button>
  </div>

  <!-- ===== Screen 6: Done ===== -->
  <div id="screen-done" class="hidden">
    <div class="done-screen">
      <div class="done-check">&#x2713;</div>
      <div class="done-title" id="done-title">完了</div>
      <div class="done-subtitle" id="done-subtitle"></div>
      <div class="done-error hidden" id="done-error"></div>
      <button class="done-btn" onclick="location.reload()">トップに戻る</button>
    </div>
  </div>
</div>

<script>
// ========== Config ==========
const API_URL = 'https://script.google.com/macros/s/AKfycbzejwlaQBa4v1sWbDhWhiSHDt3ydAhyydu_3sLqFTVYaP2PY3de4fVxCfA1JNVgYOSX/exec';
const LS_STAFF = 'dashboard_staff';
const LS_SK_STAFF = 'sokketsu_staff';

// ========== State ==========
let venueData = null;
let selectedVenue = null;
let selectedVenueIndex = -1;
let selectedBlockIndex = -1;
let selectedTeamIndex = -1;
let currentFilter = 'today';
let isSending = false;
let skSlotCount = 1;
let historyItems = [];

// ========== Init ==========
document.addEventListener('DOMContentLoaded', loadData);

async function loadData() {
  showLoading('会場データを取得中...');
  try {
    var res = await fetch(API_URL + '?action=getVenueReport');
    var data = await res.json();
    if (data.error) { showError(data.error); return; }
    venueData = data;
    document.getElementById('today-display').textContent = data.todayDisplay || '';
    renderVenueList();
  } catch (e) {
    showError('データの取得に失敗しました: ' + e.message);
  } finally {
    hideLoading();
  }
}

// ========== Screen Navigation ==========
function showScreen(id) {
  ['screen-venue-select','screen-venue-dashboard','screen-team-list','screen-sokketsu','screen-report','screen-done'].forEach(function(s) {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  window.scrollTo(0, 0);
}

function goVenueSelect() { showScreen('screen-venue-select'); }
function goVenueDashboard() { showScreen('screen-venue-dashboard'); }
function goTeamList() { showScreen('screen-team-list'); }

// ========== Venue Selection ==========
function filterVenues(filter) {
  currentFilter = filter;
  var btns = document.querySelectorAll('.date-btn');
  var labels = ['unreported','yesterday','today','tomorrow'];
  btns.forEach(function(b, i) { b.classList.toggle('active', labels[i] === filter); });
  if (filter === 'unreported') { loadUnreportedVenues(); }
  else { renderVenueList(); }
}

function renderVenueList() {
  var el = document.getElementById('venue-list');
  var venues = (venueData && venueData.venues) || [];

  var filtered = venues.filter(function(v) {
    if (currentFilter === 'yesterday') return v.dayCategory === 'yesterday';
    if (currentFilter === 'tomorrow') return v.dayCategory === 'tomorrow';
    return v.dayCategory === 'today';
  });

  if (!filtered.length) {
    var msgs = {yesterday:'前日の会場はありません',today:'本日の会場はありません',tomorrow:'翌日の会場はありません'};
    el.innerHTML = '<p class="empty-state">' + (msgs[currentFilter] || '該当なし') + '</p>';
    return;
  }

  el.innerHTML = filtered.map(function(v) {
    var ri = venues.indexOf(v);
    var bc = (v.blocks || []).length;
    var cls = 'venue-card' + (v.completed ? ' venue-done' : '');
    var dateLabel = v.dateStr ? '(' + v.dateStr + ') ' : '';
    return '<div class="' + cls + '" onclick="selectVenue(' + ri + ')">' +
      '<div class="venue-info">' +
        '<div class="venue-name">' + esc(dateLabel + v.sheetName.replace(/^\d+日\s*/, '')) + '</div>' +
        '<div class="venue-meta">' + bc + ' 大会</div>' +
      '</div>' +
      (v.completed ? '<div class="venue-status done">報告済</div>' : '') +
      '<div class="venue-arrow">&#x276F;</div>' +
    '</div>';
  }).join('');
}

function loadUnreportedVenues() {
  var el = document.getElementById('venue-list');
  el.innerHTML = '<p class="empty-state">未報告データを取得中...</p>';
  fetch(API_URL + '?action=getUnreported')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) { el.innerHTML = '<p class="empty-state text-red">' + esc(data.error) + '</p>'; return; }
      var list = data.unreported || [];
      if (!list.length) { el.innerHTML = '<p class="empty-state">未報告の会場はありません</p>'; return; }
      el.innerHTML = list.map(function(v) {
        return '<div class="venue-card" onclick="loadAndSelectVenue(\'' + esc(v.spreadsheetId) + '\',\'' + esc(v.sheetName) + '\')">' +
          '<div class="venue-info">' +
            '<div class="venue-name">(' + esc(v.dateStr) + ') ' + esc(v.sheetName.replace(/^\d+日\s*/, '')) + '</div>' +
            '<div class="venue-meta">' + (v.blockCount||'') + ' 大会 <span style="color:#e53e3e">未報告</span></div>' +
          '</div>' +
          '<div class="venue-arrow">&#x276F;</div>' +
        '</div>';
      }).join('');
    })
    .catch(function(e) { el.innerHTML = '<p class="empty-state text-red">取得エラー: ' + e.message + '</p>'; });
}

function loadAndSelectVenue(ssId, sheetName) {
  var venues = (venueData && venueData.venues) || [];
  for (var i = 0; i < venues.length; i++) {
    if (venues[i].spreadsheetId === ssId && venues[i].sheetName === sheetName) { selectVenue(i); return; }
  }
  showLoading('会場データを読み込み中...');
  fetch(API_URL + '?action=getVenueBySheet&ssId=' + encodeURIComponent(ssId) + '&sheetName=' + encodeURIComponent(sheetName))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      hideLoading();
      if (data.error) { showError(data.error); return; }
      if (!venueData) venueData = { venues: [] };
      if (!venueData.venues) venueData.venues = [];
      venueData.venues.push(data.venue);
      if (data.memberList) venueData.memberList = data.memberList;
      selectVenue(venueData.venues.length - 1);
    })
    .catch(function(e) { hideLoading(); showError('取得エラー: ' + e.message); });
}

function selectVenue(idx) {
  selectedVenueIndex = idx;
  selectedVenue = venueData.venues[idx];
  renderVenueDashboard();
  loadHistory();
  showScreen('screen-venue-dashboard');
}

// ========== Venue Dashboard ==========
function renderVenueDashboard() {
  var v = selectedVenue;
  document.getElementById('venue-title').innerHTML = '&#x1F3C0; ' + esc(v.sheetName);

  var blocks = v.blocks || [];
  var el = document.getElementById('tournament-list');
  if (!blocks.length) { el.innerHTML = '<p class="empty-state">大会データがありません</p>'; return; }

  el.innerHTML = blocks.map(function(b, bi) {
    var teamCount = (b.teams || []).length;
    var time = b.startTime || '';
    var name = b.tournamentName || '大会 ' + (bi + 1);
    var prizes = b.prizes || [];
    var prizeLabels = ['優勝賞品','副賞商品','GT景品'];
    var prizeHtml = prizes.length
      ? '<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">' + prizes.map(function(p, pi) {
          return '<span style="font-size:11px;background:#fef5e7;color:#e67e22;padding:2px 8px;border-radius:8px;font-weight:600">' + prizeLabels[pi] + ': ' + esc(p) + '</span>';
        }).join('') + '</div>'
      : '';
    return '<div class="tournament-card" onclick="selectTournament(' + bi + ')">' +
      '<div class="tc-time">' + esc(time) + '</div>' +
      '<div class="tc-info">' +
        '<div class="tc-name">' + esc(name) + '</div>' +
        '<div class="tc-sub">' + esc(b.tournamentId || '') + ' / ' + teamCount + 'チーム</div>' +
        prizeHtml +
      '</div>' +
      '<div class="tc-arrow">&#x276F;</div>' +
    '</div>';
  }).join('');
}

function loadHistory() {
  var el = document.getElementById('history-list');
  el.innerHTML = '<p class="empty-state">読み込み中...</p>';
  fetch(API_URL + '?action=getHistory')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      historyItems = data.items || [];
      renderHistory();
    })
    .catch(function() { el.innerHTML = '<p class="empty-state">履歴取得失敗</p>'; });
}

function renderHistory() {
  var el = document.getElementById('history-list');
  if (!historyItems.length) { el.innerHTML = '<p class="empty-state">本日の即決予約はありません</p>'; return; }

  el.innerHTML = historyItems.map(function(h, i) {
    var emailFail = !h.emailOk;
    return '<div class="history-card">' +
      '<div class="hc-info">' +
        '<div class="hc-time">' + esc(h.time) + ' / ' + esc(h.staffName) + '</div>' +
        '<div class="hc-team">' + esc(h.team) + ' (' + h.slotCount + '枠)</div>' +
        '<div class="hc-detail">' + esc(h.tournamentName) + '</div>' +
      '</div>' +
      '<div class="hc-status">' +
        '<div class="status-dot ' + (h.cwOk ? 'ok' : 'ng') + '" title="CW"></div>' +
        '<div class="status-dot ' + (h.emailOk ? 'ok' : 'ng') + '" title="Mail"></div>' +
        (emailFail ? '<button class="resend-btn" id="resend-' + i + '" onclick="resendEmail(' + i + ')">再送</button>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

async function resendEmail(idx) {
  var h = historyItems[idx];
  var btn = document.getElementById('resend-' + idx);
  if (!h || !btn) return;
  btn.disabled = true;
  btn.textContent = '送信中...';
  try {
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'resendEmail', email: h.email, rep: h.rep, team: h.team, phone: h.phone })
    });
    var result = await res.json();
    if (result.email === 'OK') { btn.textContent = '送信済'; btn.style.background = '#27ae60'; }
    else { btn.textContent = '失敗'; btn.disabled = false; alert('再送失敗: ' + (result.email || '不明')); }
  } catch (e) { btn.textContent = '失敗'; btn.disabled = false; alert('エラー: ' + e.message); }
}

// ========== Team List ==========
function selectTournament(bi) {
  selectedBlockIndex = bi;
  renderTeamList();
  showScreen('screen-team-list');
}

function renderTeamList() {
  var b = selectedVenue.blocks[selectedBlockIndex];
  var time = b.startTime || '';
  var name = b.tournamentName || '大会';
  var prizes = b.prizes || [];
  var prizeLabels2 = ['優勝賞品','副賞商品','GT景品'];
  var prizeHtml = prizes.length
    ? '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">' + prizes.map(function(p, pi) {
        return '<span style="font-size:12px;background:#fef5e7;color:#e67e22;padding:3px 10px;border-radius:8px;font-weight:600">' + prizeLabels2[pi] + ': ' + esc(p) + '</span>';
      }).join('') + '</div>'
    : '';
  document.getElementById('team-list-title').innerHTML = esc(time + ' ' + name) + ' <span style="font-size:13px;color:#888;font-weight:400">' + (b.teams||[]).length + 'チーム</span>' + prizeHtml;

  var el = document.getElementById('team-list');
  var teams = b.teams || [];
  if (!teams.length) { el.innerHTML = '<p class="empty-state">チームがありません</p>'; return; }

  el.innerHTML = teams.map(function(t, ti) {
    var price = t.price ? '\xA5' + Number(String(t.price).replace(/[^0-9]/g,'')).toLocaleString() : '';
    var rentalDb = t.rental || '';
    var rentalField = t.rentalInput || '';
    var rentalDisplay = rentalField || rentalDb;
    var remittance = t.remittance ? '\xA5' + Number(String(t.remittance).replace(/[^0-9]/g,'')).toLocaleString() : '';
    var pm = t.paymentMethod || '';
    var salesBadge = t.salesActivity ? '<span class="tc-sales-badge">' + esc(t.salesActivity) + '</span>' : '';

    // ステータス: 受取方法入力済み=緑, ��入力で価格あり=赤, その他=グレー
    var statusCls = '', statusLabel = '-', statusBadgeCls = 'unknown';
    if (pm) { statusCls = 'status-paid'; statusLabel = pm; statusBadgeCls = 'paid'; }
    else if (price) { statusCls = 'status-unpaid'; statusLabel = '未入力'; statusBadgeCls = 'unpaid'; }

    return '<div class="team-card ' + statusCls + '" onclick="openTeamDetail(' + ti + ')">' +
      '<div class="tc-row1">' +
        '<span class="tc-team-name">' + esc(t.teamName) + '</span>' +
        '<span class="tc-app-no">#' + esc(t.applicationNo) + '</span>' +
      '</div>' +
      '<div class="tc-row2">' +
        '<span class="tc-rep">' + esc(t.rep || '-') + '</span>' +
        '<span class="tc-phone">' + esc(t.phone || '') + '</span>' +
      '</div>' +
      '<div class="tc-row3">' +
        (rentalDisplay ? '<span class="tc-rental">' + esc(rentalDisplay) + '</span>' : '<span style="font-size:12px;color:#ccc">レンタルなし</span>') +
        salesBadge +
        '<span class="tc-price">' + (remittance || price) + '</span>' +
        '<span class="tc-pay-status ' + statusBadgeCls + '">' + statusLabel + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function getPayStatus(t) {
  var pay = String(t.payment || '').trim();
  var price = String(t.price || '').trim();
  // 入金済み
  if (pay === '1' || pay === 'true' || pay === 'TRUE') return { cls: 'status-paid', label: '入金済', badgeCls: 'paid' };
  // 価格あり = 現金受渡し
  if (price && price !== '0') return { cls: 'status-unpaid', label: '現金', badgeCls: 'unpaid' };
  // その他
  if (pay) return { cls: 'status-transfer', label: '振込', badgeCls: 'transfer' };
  return { cls: '', label: '-', badgeCls: 'unknown' };
}

// ========== Team Detail Bottom Sheet ==========
function openTeamDetail(ti) {
  selectedTeamIndex = ti;
  var b = selectedVenue.blocks[selectedBlockIndex];
  var t = b.teams[ti];

  var price = t.price ? '\xA5' + Number(String(t.price).replace(/[^0-9]/g,'')).toLocaleString() : '-';

  var html = '<div class="bs-header">' +
    '<div>' +
      '<div class="bs-team-name">' + esc(t.teamName) + '</div>' +
      '<div style="font-size:13px;color:#888;margin-top:2px">#' + esc(t.applicationNo) + ' / ' + esc(b.tournamentName) + '</div>' +
    '</div>' +
    '<button class="bs-close" onclick="closeBottomSheet()">&#x2715;</button>' +
  '</div>';

  // Info section
  html += '<div class="bs-section">' +
    '<div class="bs-section-title">チーム情報</div>' +
    '<div class="bs-info-grid">' +
      '<div class="bs-info-item"><div class="bs-info-label">代表者</div><div class="bs-info-value">' + esc(t.rep || '-') + '</div></div>' +
      '<div class="bs-info-item"><div class="bs-info-label">フリガナ</div><div class="bs-info-value">' + esc(t.furigana || '-') + '</div></div>' +
      '<div class="bs-info-item"><div class="bs-info-label">電話番号</div><div class="bs-info-value" style="color:#1a5276">' + esc(t.phone || '-') + '</div></div>' +
      '<div class="bs-info-item"><div class="bs-info-label">申請番号</div><div class="bs-info-value">' + esc(t.applicationNo || '-') + '</div></div>' +
      '<div class="bs-info-item"><div class="bs-info-label">レンタル</div><div class="bs-info-value" style="color:#e67e22">' + esc(t.rental || 'なし') + '</div></div>' +
      '<div class="bs-info-item"><div class="bs-info-label">参加費</div><div class="bs-info-value" style="font-size:18px;color:#1a5276">' + price + '</div></div>' +
      '<div class="bs-info-item"><div class="bs-info-label">入金</div><div class="bs-info-value">' + esc(getPayStatus(t).label) + '</div></div>' +
      '<div class="bs-info-item"><div class="bs-info-label">支払方法</div><div class="bs-info-value">' + (t.price ? '現金' : '振込') + '</div></div>' +
    '</div>' +

function closeBottomSheet() {
  document.getElementById('bottom-sheet').classList.remove('show');

function buildSelect(id, options, selected) {
  var html = '<select id="' + id + '">';
  options.forEach(function(o) {
    var label = o || '---';
    html += '<option value="' + esc(o) + '"' + (o === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  });
  return html + '</select>';
}

async function saveTeamData() {
  var b = selectedVenue.blocks[selectedBlockIndex];
  var t = b.teams[selectedTeamIndex];

  var salesVal = document.getElementById('bs-sales').value;
  var rankVal = document.getElementById('bs-rank').value;
  var remarksVal = document.getElementById('bs-remarks').value;
  var rentalInput = document.getElementById('bs-rental-input').value;
  var remittance = document.getElementById('bs-remittance').value;
  var paymentMethod = document.getElementById('bs-payment-method').value;

  // Update local state
  t.salesActivity = salesVal;
  t.rank = rankVal;
  t.remarks = remarksVal;
  t.rentalInput = rentalInput;
  t.remittance = remittance;
  t.paymentMethod = paymentMethod;

  // Save to sheet
  showLoading('保存中...');
  try {
    var teamData = { teamRow: t.teamRow, salesActivity: salesVal, rank: rankVal, remarks: remarksVal };
    teamData.rentalInput = rentalInput;
    teamData.remittance = remittance;
    teamData.paymentMethod = paymentMethod;

    var payload = {
      action: 'submitReport',
      spreadsheetId: selectedVenue.spreadsheetId,
      sheetName: selectedVenue.sheetName,
      teams: [teamData],
      staffList: [],
      markComplete: false
    };
    var res = await fetch(API_URL, { method: 'POST', headers: {'Content-Type':'text/plain'}, body: JSON.stringify(payload) });
    var result = await res.json();
    hideLoading();
    if (result.error) { alert('保存エラー: ' + result.error); return; }
    closeBottomSheet();
    renderTeamList(); // refresh
  } catch (e) { hideLoading(); alert('保存エラー: ' + e.message); }
}

function goSokketsu() {
  closeBottomSheet();
  var b = selectedVenue.blocks[selectedBlockIndex];
  var t = b.teams[selectedTeamIndex];

  // We need email from the tournaments API
  // For now show what we have
  document.getElementById('sk-team-badge').textContent = t.teamName;
  document.getElementById('sk-disp-team').textContent = t.teamName;
  document.getElementById('sk-disp-rep').textContent = t.rep || '-';
  document.getElementById('sk-disp-phone').textContent = t.phone || '-';
  document.getElementById('sk-disp-email').textContent = t.email || '(メール取得中...)';

  // Fetch email from tournaments API
  fetchTeamEmail(t);

  // Restore staff name
  var saved = localStorage.getItem(LS_SK_STAFF);
  if (saved) document.getElementById('sk-staff-name').value = saved;

  // Type selector
  skSlotCount = 1;
  var ts = document.getElementById('sk-type-selector');
  ts.innerHTML = '';
  for (var i = 1; i <= 5; i++) {
    ts.innerHTML += '<div class="type-btn' + (i===1?' selected':'') + '" onclick="selectSkType(' + i + ')">' + i + '枠</div>';
  }
  renderSkSlots();
  showScreen('screen-sokketsu');
}

async function fetchTeamEmail(team) {
  // Try to get email from tournaments API
  try {
    var res = await fetch(API_URL + '?action=getTournaments');
    var data = await res.json();
    var tournaments = data.tournaments || [];
    for (var ti = 0; ti < tournaments.length; ti++) {
      var teams = tournaments[ti].teams || [];
      for (var j = 0; j < teams.length; j++) {
        if (teams[j].team === team.teamName) {
          team.email = teams[j].email || '';
          team.realEmail = teams[j].realEmail || teams[j].email || '';
          document.getElementById('sk-disp-email').textContent = team.email || '(メールなし)';
          return;
        }
      }
    }
    document.getElementById('sk-disp-email').textContent = '(メール未取得)';
  } catch (e) {
    document.getElementById('sk-disp-email').textContent = '(取得失敗)';
  }
}

function skApplyCopy(n) {
  var checked = document.getElementById('sk-copy' + n).checked;
  ['date','venue','time','level'].forEach(function(f) {
    var inp = document.getElementById('sk-' + f + n);
    if (checked) { inp.value = document.getElementById('sk-' + f + '1').value; inp.readOnly = true; inp.style.background = '#f0f0f0'; }
    else { inp.readOnly = false; inp.style.background = ''; }
  });
}

function skUpdateShoeSizes(slot) {
  var count = parseInt(document.getElementById('sk-shoes' + slot).value) || 0;
  var c = document.getElementById('sk-shoeSizes' + slot);
  var html = '';
  for (var n=1;n<=count;n++) {
    html += '<div class="rental-item" style="padding-left:30px"><label style="font-size:12px;color:#666">' + n + '足目サイズ:</label><select id="sk-shoesize' + slot + '_' + n + '">';
    html += '<option value="">選択</option>';
    for (var s=26;s<=29;s+=0.5) html += '<option value="' + s.toFixed(1) + '">' + s.toFixed(1) + 'cm</option>';
    html += '</select></div>';
  }
  c.innerHTML = html;
}

function skGetRentalTotal(i) {
  return (parseInt(document.getElementById('sk-bib'+i).value)||0)*1000 + (parseInt(document.getElementById('sk-ball'+i).value)||0)*500 + (parseInt(document.getElementById('sk-shoes'+i).value)||0)*1500;
}

function skGetRentalLabels(i) {
  var items = [];
  var bib = parseInt(document.getElementById('sk-bib'+i).value)||0;
  if (bib) items.push('ビブス'+bib+'セット(\xA5'+(bib*1000).toLocaleString()+')');
  var ball = parseInt(document.getElementById('sk-ball'+i).value)||0;
  if (ball) items.push('ボール'+ball+'球(\xA5'+(ball*500).toLocaleString()+')');
  var shoes = parseInt(document.getElementById('sk-shoes'+i).value)||0;
  if (shoes) {
    var sizes = [];
    for (var n=1;n<=shoes;n++) { var el=document.getElementById('sk-shoesize'+i+'_'+n); if (el&&el.value) sizes.push(el.value+'cm'); }
    items.push('シューズ'+shoes+'足'+(sizes.length?'('+sizes.join(',')+')':'')+' \xA5'+(shoes*1500).toLocaleString());
  }
  return items;
}

function skGetRentalData(i) {
  var shoes = parseInt(document.getElementById('sk-shoes'+i).value)||0;
  var sizes = [];
  for (var n=1;n<=shoes;n++) { var el=document.getElementById('sk-shoesize'+i+'_'+n); if (el&&el.value) sizes.push(el.value); }
  return {
    bibCount: parseInt(document.getElementById('sk-bib'+i).value)||0,
    ballCount: parseInt(document.getElementById('sk-ball'+i).value)||0,
    shoesCount: shoes, shoesSizes: sizes,
    rentalTotal: skGetRentalTotal(i), rentalLabels: skGetRentalLabels(i)
  };
}

function skCalcTotal() {
  var grand = 0, bhtml = '';
  for (var i=1;i<=skSlotCount;i++) {
    var p = parseInt((document.getElementById('sk-price'+i)||{}).value)||0;
    var d = parseInt((document.getElementById('sk-coupon'+i)||{}).value)||0;
    var r = skGetRentalTotal(i);
    var st = p - d + r;
    var se = document.getElementById('sk-slotSummary'+i);
    if (se && p) {
      var sh = '<div class="slot-summary">';
      sh += '<div class="summary-row"><span>金額</span><span>\xA5'+p.toLocaleString()+'</span></div>';
      if (d) sh += '<div class="summary-row discount"><span>クーポン</span><span>-\xA5'+d.toLocaleString()+'</span></div>';
      if (r) {
        sh += '<div class="summary-row rental"><span>レンタル</span><span>+\xA5'+r.toLocaleString()+'</span></div>';
        var labels = skGetRentalLabels(i);
        if (labels.length) sh += '<div class="rental-detail">('+labels.join(' / ')+')</div>';
      }
      sh += '<div class="summary-total"><span>この枠の合計</span><span>\xA5'+st.toLocaleString()+'</span></div></div>';
      se.innerHTML = sh;
      bhtml += '<div class="gt-breakdown">予約'+i+': \xA5'+st.toLocaleString()+'</div>';
      grand += st;
    } else if (se) { se.innerHTML = ''; }
  }
  document.getElementById('sk-total-breakdown').innerHTML = bhtml;
  document.getElementById('sk-grand-total').textContent = grand ? '\xA5'+grand.toLocaleString() : '-';
}

function showSokketsuConfirm() {
  // Validate
  var staffName = document.getElementById('sk-staff-name').value.trim();
  if (!staffName) { alert('入力者名を入力してください'); return; }
  localStorage.setItem(LS_SK_STAFF, staffName);

  for (var i=1;i<=skSlotCount;i++) {
    if (!document.getElementById('sk-date'+i).value || !document.getElementById('sk-venue'+i).value.trim()
      || !document.getElementById('sk-time'+i).value.trim() || !document.getElementById('sk-level'+i).value.trim()
      || !document.getElementById('sk-price'+i).value) {
      alert('予約'+i+'の入力が不足しています');
      return;
    }
  }

  var b = selectedVenue.blocks[selectedBlockIndex];
  var t = b.teams[selectedTeamIndex];
  document.getElementById('sk-confirm-rep').textContent = t.rep || '-';
  document.getElementById('sk-confirm-email').textContent = t.email || t.realEmail || '(メールなし)';

  var weekdays = ['日','月','火','水','木','金','土'];
  var html = '';
  for (var i=1;i<=skSlotCount;i++) {
    var dv = document.getElementById('sk-date'+i).value;
    var dd = dv;
    try { var dt=new Date(dv); dd=(dt.getMonth()+1)+'月'+dt.getDate()+'日('+weekdays[dt.getDay()]+')'; } catch(e){}
    html += '<div class="confirm-section">';
    if (skSlotCount>1) html += '<div class="confirm-section-title">予約'+i+'</div>';
    html += '<div class="confirm-item" style="font-size:16px;font-weight:700">'+dd+'</div>';
    html += '<div class="confirm-item">'+esc(document.getElementById('sk-venue'+i).value)+'</div>';
    html += '<div class="confirm-item">'+esc(document.getElementById('sk-time'+i).value)+'〜 / '+esc(document.getElementById('sk-level'+i).value)+'</div>';
    var rl = skGetRentalLabels(i);
    if (rl.length) html += '<div class="confirm-item" style="color:#e67e22;font-size:12px">レンタル: '+rl.join(', ')+'</div>';
    html += '</div>';
  }
  html += '<div class="confirm-section" style="text-align:center;font-size:22px;font-weight:800;color:#e65100">' + document.getElementById('sk-grand-total').textContent + '</div>';

  document.getElementById('sokketsu-confirm-body').innerHTML = html;
  document.getElementById('sokketsu-confirm-overlay').classList.add('show');
}

function closeSokketsuConfirm() { document.getElementById('sokketsu-confirm-overlay').classList.remove('show'); }

async function doSubmitSokketsu() {
  if (isSending) return;
  isSending = true;
  var btn = document.getElementById('sokketsu-send-btn');
  btn.disabled = true;
  closeSokketsuConfirm();
  showLoading('送信中...');

  var b = selectedVenue.blocks[selectedBlockIndex];
  var t = b.teams[selectedTeamIndex];
  var couponLabels = {'0':'なし','1000':'1,000円引き','2000':'2,000円引き','3000':'3,000円引き','4000':'4,000円引き','5000':'5,000円引き','8000':'8,000円引き'};
  var bookings = [], grand = 0, rentalGrand = 0;

  for (var i=1;i<=skSlotCount;i++) {
    var p = parseInt(document.getElementById('sk-price'+i).value)||0;
    var cv = document.getElementById('sk-coupon'+i).value;
    var d = parseInt(cv)||0;
    var sub = p - d;
    grand += sub;
    var rental = skGetRentalData(i);
    rentalGrand += rental.rentalTotal;
    bookings.push({
      date: document.getElementById('sk-date'+i).value,
      venue: document.getElementById('sk-venue'+i).value,
      time: document.getElementById('sk-time'+i).value,
      level: document.getElementById('sk-level'+i).value,
      price: p, couponValue: cv, couponLabel: couponLabels[cv]||'なし',
      discount: d, subtotal: sub, rental: rental,
    });
  }

  var formData = {
    staffName: document.getElementById('sk-staff-name').value,
    slotCount: skSlotCount,
    team: t.teamName, rep: t.rep || '', phone: t.phone || '',
    email: t.email || '', realEmail: t.realEmail || t.email || '',
    tournamentId: b.tournamentId || '', tournamentName: b.tournamentName || '',
    venue: selectedVenue.sheetName,
    bookings: bookings,
    grandTotal: grand + rentalGrand, rentalGrandTotal: rentalGrand,
  };

  try {
    var res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(formData) });
    var result = await res.json();
    hideLoading();
    isSending = false;

    document.getElementById('done-title').textContent = '即決予約完了';
    var msgs = [];
    if (result.cw === 'OK') msgs.push('Chatworkタスク作成済');
    if (result.email === 'OK') msgs.push('確認メール送信済');
    else if (result.email) msgs.push('メール: ' + result.email);
    document.getElementById('done-subtitle').textContent = msgs.join(' / ') || '';
    var errEl = document.getElementById('done-error');
    if (result.error) { errEl.textContent = result.error; errEl.classList.remove('hidden'); }
    else { errEl.classList.add('hidden'); }
    showScreen('screen-done');
  } catch (e) {
    hideLoading();
    isSending = false;
    btn.disabled = false;
    alert('送信失敗: ' + e.message);
  }
}

            '<div><div style="font-size:10px;color:#888;margin-bottom:2px">順位</div>' + rankHtml + '</div>' +
          '</div>' +
          '<div><div style="font-size:10px;color:#888;margin-bottom:2px">備考</div><input type="text" id="rpt-remarks-'+bi+'-'+ti+'" value="'+esc(t.remarks||'')+'" placeholder="備考" style="'+sStyle+'"></div>' +
        '</div>';
      }).join('') +
      '</div></div>';
  }).join('');
}

function onReportCancelToggle(bi) {
  var cb = document.getElementById('rpt-cancel-' + bi);
  var div = document.getElementById('rpt-teams-' + bi);
  div.classList.toggle('teams-disabled', cb.checked);
}

function renderStaff() {
  var sa = selectedVenue.staffArea || {};
  var memberList = (venueData.memberList && venueData.memberList.length) ? venueData.memberList : (selectedVenue.memberList || []);
  var area = document.getElementById('staff-area');
  var slots = sa.staff || [];
  var maxSlots = 13;
  var display = [];
  for (var i=0;i<maxSlots;i++) display.push(slots[i] || {row:0,name:'',checkIn:'',checkOut:'',breakMin:0});

  var optHtml = '<option value="">--</option>';
  memberList.forEach(function(n) { optHtml += '<option value="'+esc(n)+'">'+esc(n)+'</option>'; });

  area.innerHTML = display.map(function(s,i) {
    var hasName = s.name && s.name.trim();
    return '<div class="staff-entry '+(hasName?'has-name':'')+'" id="se-'+i+'">' +
      '<div class="staff-row-top">' +
        '<div class="staff-num">'+(i+1)+'</div>' +
        '<select id="sn-'+i+'" onchange="onStaffNameChange('+i+')">'+optHtml+'</select>' +
        '<label class="nw-toggle"><input type="checkbox" id="snw-'+i+'" onchange="onNormalWorkToggle('+i+')"><span class="switch"></span><span>通常</span></label>' +
      '</div>' +
      '<div class="staff-row-bottom '+(hasName?'':'collapsed')+'" id="sr-'+i+'">' +
        '<div><div class="staff-field-label">出勤</div><input type="time" id="sci-'+i+'" value="'+esc(s.checkIn||'')+'"></div>' +
        '<div><div class="staff-field-label">退勤</div><input type="time" id="sco-'+i+'" value="'+esc(s.checkOut||'')+'"></div>' +
        '<div><div class="staff-field-label">休憩</div><input type="number" id="sb-'+i+'" value="'+(s.breakMin||'')+'" placeholder="分" min="0" step="15"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  // Restore names
  display.forEach(function(s,i) {
    if (s.name) {
      var sel = document.getElementById('sn-'+i);
      sel.value = s.name;
      if (sel.value !== s.name) {
        var opt = document.createElement('option');
        opt.value = s.name; opt.textContent = s.name;
        sel.appendChild(opt); sel.value = s.name;
      }
    }
  });
}

function onStaffNameChange(idx) {
  var sel = document.getElementById('sn-'+idx);
  var hasName = sel.value.trim() !== '';
  document.getElementById('se-'+idx).classList.toggle('has-name', hasName);
  document.getElementById('sr-'+idx).classList.toggle('collapsed', !hasName);
}

function onNormalWorkToggle(idx) {
  var cb = document.getElementById('snw-'+idx);
  var ci = document.getElementById('sci-'+idx);
  var co = document.getElementById('sco-'+idx);
  var sb = document.getElementById('sb-'+idx);
  if (cb.checked) {
    ci.value = document.getElementById('nw-start').value;
    co.value = document.getElementById('nw-end').value;
    sb.value = document.getElementById('nw-break').value;
    ci.disabled = co.disabled = sb.disabled = true;
  } else {
    ci.disabled = co.disabled = sb.disabled = false;
  }
}

function applyAllNormal() {
  for (var i=0;i<13;i++) {
    var sel = document.getElementById('sn-'+i);
    if (sel && sel.value.trim()) {
      document.getElementById('snw-'+i).checked = true;
      onNormalWorkToggle(i);
      document.getElementById('sr-'+i).classList.remove('collapsed');
      document.getElementById('se-'+i).classList.add('has-name');
    }
  }
}

function renderCheckItems() {
  var sa = selectedVenue.staffArea || {};
  var items = sa.checkItems || [];
  var area = document.getElementById('check-items-area');
  if (!items.length) { area.innerHTML = '<p class="empty-state">チェック項目がありません</p>'; return; }
  area.innerHTML = items.map(function(item,i) {
    return '<div class="check-item"><input type="checkbox" id="chk-'+i+'" '+(item.checked?'checked':'')+'><label for="chk-'+i+'">'+esc(item.text)+'</label></div>';
  }).join('');
}

// ===== Report Confirm & Submit =====
function showReportConfirm() {
  if (isSending) return;
  var staffName = document.getElementById('report-staff-name').value.trim();
  if (!staffName) { alert('報告者名を入力してください'); document.getElementById('report-staff-name').focus(); return; }
  localStorage.setItem(LS_STAFF, staffName);

  // Validate
  var errors = [];
  var blocks = selectedVenue.blocks || [];
  blocks.forEach(function(b,bi) {
    var cancelled = document.getElementById('rpt-cancel-'+bi).checked;
    if (cancelled) return;
    (b.teams||[]).forEach(function(t,ti) {
      if (!document.getElementById('rpt-sales-'+bi+'-'+ti).value) errors.push(esc(t.teamName)+' の営業活動が未選択');
    });
  });
  var sa = selectedVenue.staffArea || {};
  var checkItems = sa.checkItems || [];
  var unchecked = 0;
  checkItems.forEach(function(item,i) { if (!document.getElementById('chk-'+i).checked) unchecked++; });
  if (unchecked) errors.push('チェックが '+unchecked+' 件未チェック');
  if (errors.length) { alert(errors.join('\n')); return; }

  // Build confirm
  var html = '<div class="confirm-section"><div class="confirm-section-title">報告者</div><div class="confirm-item">'+esc(staffName)+' / '+esc(selectedVenue.sheetName)+'</div></div>';
  blocks.forEach(function(b,bi) {
    var teamLines = (b.teams||[]).map(function(t,ti) {
      var s = document.getElementById('rpt-sales-'+bi+'-'+ti).value;
      var r = document.getElementById('rpt-rank-'+bi+'-'+ti).value;
      var rm = document.getElementById('rpt-remarks-'+bi+'-'+ti).value;
      return '<div class="confirm-item">'+esc(t.teamName)+' / '+(s?'営業:'+esc(s):'')+' '+(r?esc(r):'')+' '+(rm?esc(rm):'')+'</div>';
    }).join('');
    html += '<div class="confirm-section"><div class="confirm-section-title">'+esc(b.tournamentName||'大会'+(bi+1))+'</div>'+teamLines+'</div>';
  });

  var staffLines = '';
  for (var i=0;i<13;i++) {
    var n = document.getElementById('sn-'+i).value.trim();
    if (!n) continue;
    staffLines += '<div class="confirm-item">'+esc(n)+' '+document.getElementById('sci-'+i).value+'-'+document.getElementById('sco-'+i).value+' 休憩'+(document.getElementById('sb-'+i).value||0)+'分</div>';
  }
  if (staffLines) html += '<div class="confirm-section"><div class="confirm-section-title">スタッフ</div>'+staffLines+'</div>';

  document.getElementById('report-confirm-body').innerHTML = html;
  document.getElementById('report-confirm-overlay').classList.add('show');
}

function closeReportConfirm() { document.getElementById('report-confirm-overlay').classList.remove('show'); }

async function doSubmitReport() {
  if (isSending) return;
  isSending = true;
  document.getElementById('report-send-btn').disabled = true;
  closeReportConfirm();
  showLoading('送信中...');

  var blocks = selectedVenue.blocks || [];
  var teams = [];
  blocks.forEach(function(b,bi) {
    (b.teams||[]).forEach(function(t,ti) {
      teams.push({
        teamRow: t.teamRow,
        salesActivity: document.getElementById('rpt-sales-'+bi+'-'+ti).value,
        rank: document.getElementById('rpt-rank-'+bi+'-'+ti).value,
        remarks: document.getElementById('rpt-remarks-'+bi+'-'+ti).value,
      });
    });
  });

  var staffList = [];
  var sa = selectedVenue.staffArea || {};
  var slots = sa.staff || [];
  for (var i=0;i<13;i++) {
    var name = document.getElementById('sn-'+i).value.trim();
    var row = (slots[i]&&slots[i].row) ? slots[i].row : (390+i);
    staffList.push({
      row: row, name: name,
      checkIn: document.getElementById('sci-'+i).value,
      checkOut: document.getElementById('sco-'+i).value,
      breakMin: parseInt(document.getElementById('sb-'+i).value)||0,
      normalWork: document.getElementById('snw-'+i).checked,
    });
  }

  var checkItems = (sa.checkItems||[]).map(function(item,i) {
    return { row: item.row, checked: document.getElementById('chk-'+i).checked };
  });

  var payload = {
    action: 'submitReport',
    staffName: document.getElementById('report-staff-name').value.trim(),
    spreadsheetId: selectedVenue.spreadsheetId,
    sheetName: selectedVenue.sheetName,
    teams: teams, staffList: staffList,
    accidentReport: document.getElementById('accident-report').value.trim(),
    otherReport: document.getElementById('other-report').value.trim(),
    checkItems: checkItems, markComplete: true,
  };

  try {
    var res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload) });
    var result = await res.json();
    hideLoading();
    isSending = false;

    document.getElementById('done-title').textContent = '報告完了';
    document.getElementById('done-subtitle').textContent = selectedVenue.sheetName + ' の完了報告を送信しました';
    var errEl = document.getElementById('done-error');
    if (result.error) { errEl.textContent = result.error; errEl.classList.remove('hidden'); }
    else { errEl.classList.add('hidden'); }
    showScreen('screen-done');
  } catch (e) {
    hideLoading();
    isSending = false;
    document.getElementById('report-send-btn').disabled = false;
    alert('送信失敗: ' + e.message);
  }
}

// ========== Utility ==========
function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg || '';
  var el = document.getElementById('loading-overlay');
  el.classList.remove('hidden');
  el.style.opacity = '1';
}
function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
function showError(msg) {
  var el = document.getElementById('error-banner');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 5000);
}
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
</script>
