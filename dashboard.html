     dashboard.html — テスト用（本番は index.html）
     本番反映する場合は index.html を編集すること
     ======================================== -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BOOKS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Hiragino Sans',sans-serif;
  background:#f5f5f7;
  color:#1d1d1f;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}
.container{max-width:428px;margin:0 auto;padding:0 20px 120px}

/* ===== Loading ===== */
#loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#f5f5f7;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:28px;height:28px;border:2.5px solid #d2d2d7;border-top-color:#1d1d1f;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:16px;font-size:13px;color:#86868b;font-weight:500}

/* ===== Header ===== */
.header{padding:48px 0 20px;text-align:left}
.header h1{font-size:28px;font-weight:700;color:#1d1d1f;line-height:1.15;letter-spacing:-.03em}
.header .badge{font-size:15px;color:#86868b;font-weight:400;margin-top:4px;display:block;letter-spacing:-.01em}

/* ===== Section ===== */
.section{background:#fff;border-radius:12px;padding:0;margin-bottom:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.04)}
.section-inner{padding:20px}
.section-title{font-size:13px;font-weight:600;color:#86868b;margin-bottom:16px;letter-spacing:.02em}

/* ===== Date Filter ===== */
.date-nav{display:flex;gap:8px;margin-bottom:16px}
.date-btn{padding:8px 16px;border:none;border-radius:980px;background:transparent;font-size:13px;font-weight:600;color:#86868b;cursor:pointer;transition:all .2s}
.date-btn.active{background:#1d1d1f;color:#fff}
.date-btn:first-child.active{background:#ff3b30;color:#fff}
.date-btn:active{opacity:.7}

/* ===== Cards (common) ===== */
.card{display:flex;align-items:center;padding:14px 20px;cursor:pointer;transition:background .15s;position:relative}
.card:active{background:#f5f5f7}
.card+.card{border-top:1px solid #d2d2d7}
.card .card-body{flex:1;min-width:0}
.card .card-name{font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .card-meta{font-size:12px;color:#86868b;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .card-arrow{color:#c7c7cc;font-size:13px;font-weight:300;margin-left:12px;flex-shrink:0}
.card.done .card-arrow{opacity:.4}
.meta-badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.meta-badge.green{color:#fff;background:#34c759}
.meta-badge.orange{color:#af8700;background:#fefce8}

/* Team */
.team-card{display:flex;align-items:stretch;cursor:pointer;transition:background .15s}
.team-card:active{background:#f0f0f5}
.team-card+.team-card{border-top:1px solid #d2d2d7}
.team-card .t-row{display:flex;justify-content:space-between;align-items:center}
.team-card .t-row+.t-row{margin-top:4px}
.team-card .team-name{font-size:17px;font-weight:700;color:#000}
.team-card .app-no{font-size:11px;color:#aeaeb2}
.team-card .rep-name{font-size:13px;color:#636366}
.team-card .tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.team-card .tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.tag.visit{color:#636366;background:#f0f0f5}
.tag.sokketsu{color:#007aff;background:#eff6ff}
.tag.rank{color:#1d1d1f;background:#f0f0f5}
.tag.rental{color:#af8700;background:#fefce8}
.tag.local-pay{color:#fff;background:#ff3b30;font-weight:600}
.tag.local-pay-done{color:#ff3b30;background:#fef2f2;font-weight:500}
.team-card .rental-tag{font-size:11px;color:#af8700;background:#fefce8;padding:1px 6px;border-radius:4px;font-weight:500}
.team-card .price{font-size:15px;font-weight:700;letter-spacing:-.02em}
.team-card .pay-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.pay-badge.paid{color:#34c759;background:#f0fdf4}
.pay-badge.unpaid{color:#ff3b30;background:#fef2f2}
.pay-badge.unknown{color:#aeaeb2;background:#f5f5f7}
.team-card .sales-tag{font-size:11px;font-weight:600;color:#007aff;background:#eff6ff;padding:1px 6px;border-radius:4px}
.rc-col-header{display:flex;align-items:center;padding:0 0 0 10px;gap:4px}
.rc-col-header span{font-size:10px;font-weight:500;color:#aeaeb2;letter-spacing:.05em}
.team-card .rc-area{display:flex;align-items:center;justify-content:center;width:48px;min-width:48px;border-right:1px solid #e5e5ea;-webkit-tap-highlight-color:transparent}
.team-card .rc-box{width:26px;height:26px;border-radius:7px;border:2px solid #d2d2d7;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:16px;color:transparent}
.team-card.reception-done .rc-area{background:#f0fdf4}
.team-card.reception-done .rc-box{border-color:#34c759;background:#34c759;color:#fff}
.team-card.reception-cancel .rc-area{background:#f5f5f7}
.team-card.reception-cancel .rc-box{border-color:#aeaeb2;background:#aeaeb2;color:#fff}
.team-card .tc-body{flex:1;padding:16px 20px;min-width:0}
.team-card.reception-done .tc-body{background:#f0fdf4}
.team-card.reception-cancel .tc-body{background:#f5f5f7;opacity:.5}
.team-card.pay-pending .tc-body{background:#fef2f2}
.team-card.pay-complete .tc-body{background:#f0fdf4}

/* ===== Back ===== */
.back-btn{display:inline-flex;align-items:center;gap:2px;color:#86868b;font-size:15px;font-weight:400;cursor:pointer;padding:12px 0;background:none;border:none}
.back-btn:active{opacity:.5}

/* ===== History (送信履歴スタイル) ===== */
.history-header{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border-radius:12px;padding:24px;text-align:center;margin-bottom:12px}
.history-header h2{font-size:18px;font-weight:700;margin-bottom:4px}
.history-header .count-badge{display:inline-block;background:rgba(255,255,255,.25);color:#fff;font-size:13px;padding:2px 12px;border-radius:980px;font-weight:600}
.history-filter{display:flex;gap:8px;margin-bottom:16px}
.history-filter button{flex:1;padding:10px;border-radius:980px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.history-filter button.inactive{background:#fff;color:#1d1d1f;border:1.5px solid #d2d2d7}
.history-filter button.active{background:#fff;color:#2563eb;border:1.5px solid #2563eb}
.history-date-label{font-size:14px;font-weight:700;color:#2563eb;padding:8px 0}
.history-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:10px;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04)}
.history-card .hc-time{font-size:12px;color:#86868b;margin-bottom:4px}
.history-card .hc-title{font-size:17px;font-weight:700;margin-bottom:2px}
.history-card .hc-sub{font-size:13px;color:#86868b;margin-bottom:10px}
.history-card .hc-status{font-size:14px;font-weight:600;padding:4px 0}
.history-card .hc-status.ok{color:#34c759}
.history-card .hc-status.ng{color:#ff3b30}
.history-card .hc-resend{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.history-card .hc-resend:disabled{opacity:.5}
.history-card .hc-note{font-size:12px;color:#aeaeb2;text-align:center;margin-top:6px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.ok{background:#34c759}
.dot.ng{background:#ff3b30}
.resend-btn{padding:5px 10px;background:#ff3b30;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.resend-btn:disabled{opacity:.3}

/* ===== Bottom Sheet ===== */
.bs-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:500}
.bs-overlay.show{display:block}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:#fff;border-radius:12px 12px 0 0;z-index:501;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom,24px)}
.bottom-sheet.show{transform:translateY(0)}
.bs-handle{width:36px;height:5px;background:#d2d2d7;border-radius:3px;margin:8px auto 4px}
.bs-head{padding:12px 20px 16px}
.bs-name{font-size:22px;font-weight:700;letter-spacing:-.02em}
.bs-sub{font-size:13px;color:#86868b;margin-top:2px}
.bs-close{position:absolute;right:16px;top:16px;width:30px;height:30px;background:#e5e5ea;border:none;border-radius:50%;font-size:12px;color:#636366;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bs-group{padding:0 20px 16px}
.bs-label{font-size:11px;font-weight:600;color:#86868b;margin-bottom:8px;letter-spacing:.02em}
.bs-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(0,0,0,.06);border-radius:10px;overflow:hidden}
.bs-cell{background:#fff;padding:12px}
.bs-cell-label{font-size:11px;color:#aeaeb2}
.bs-cell-value{font-size:15px;font-weight:600;margin-top:2px}
.bs-sep{height:.5px;background:rgba(0,0,0,.06);margin:0 20px 16px}
.bs-field{margin-bottom:12px}
.bs-field label{display:block;font-size:11px;font-weight:600;color:#86868b;margin-bottom:4px}
.bs-field select,.bs-field input{width:100%;padding:10px 12px;border:1px solid #d2d2d7;border-radius:8px;font-size:17px;background:#fff;color:#1d1d1f;font-family:inherit;-webkit-appearance:none}
.bs-field select:focus,.bs-field input:focus{outline:none;border-color:#007aff}
.bs-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bs-pay{background:#fffbeb;border-radius:10px;padding:14px;margin:0 20px 16px}
.bs-pay-title{font-size:11px;font-weight:600;color:#af8700;margin-bottom:8px}
.bs-btns{padding:0 20px 20px;display:flex;flex-direction:column;gap:8px}
.btn-primary{width:100%;padding:14px;background:#007aff;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:-.01em}
.btn-primary:active{opacity:.75}
.btn-primary:disabled{opacity:.3}
.btn-danger{width:100%;padding:14px;background:#ff3b30;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:-.01em}
.btn-danger:active{opacity:.75}

/* ===== Report ===== */
.report-btn{width:100%;padding:16px;background:#34c759;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;margin-top:12px;letter-spacing:-.01em}
.report-btn:active{opacity:.75}
.report-btn:disabled{opacity:.3}

/* ===== Toast ===== */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d1d1f;color:#fff;padding:12px 24px;border-radius:980px;font-size:13px;font-weight:500;opacity:0;transition:all .3s cubic-bezier(.32,.72,0,1);z-index:9000;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Sync Button ===== */
.sync-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px}
.sync-time{font-size:11px;color:#aeaeb2}
.sync-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;background:#f5f5f7;border:1px solid #e5e5ea;border-radius:980px;font-size:12px;font-weight:600;color:#007aff;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.sync-btn:active{background:#e5e5ea;transform:scale(.96)}
.sync-btn.loading{color:#aeaeb2;pointer-events:none}
.sync-btn .sync-icon{display:inline-block;font-size:13px;transition:transform .4s}
.sync-btn.loading .sync-icon{animation:syncSpin .8s linear infinite}
@keyframes syncSpin{to{transform:rotate(360deg)}}

/* ===== Forms ===== */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:#636366;margin-bottom:6px}
.form-group label .req{color:#ff3b30;font-size:11px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:1px solid #d2d2d7;border-radius:10px;font-size:17px;background:#fff;color:#1d1d1f;-webkit-appearance:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#007aff}
.form-group textarea{resize:vertical;min-height:88px;line-height:1.5}

/* Staff */
.nw-box{background:#f5f5f7;border-radius:10px;padding:14px;margin-bottom:16px}
.nw-title{font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:10px}
.nw-inputs{display:grid;grid-template-columns:1fr 1fr 72px;gap:8px;margin-bottom:10px}
.nw-inputs input{width:100%;padding:8px;border:1px solid #d2d2d7;border-radius:8px;font-size:15px;background:#fff;text-align:center;font-family:inherit;-webkit-appearance:none}
.nw-inputs input:focus{outline:none;border-color:#007aff}
.nw-label{font-size:11px;color:#86868b;text-align:center;margin-bottom:2px}
.apply-btn{width:100%;padding:10px;background:#007aff;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.apply-btn:active{opacity:.75}
.staff-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.06)}
.staff-row:last-child{border-bottom:none}
.staff-num{font-size:11px;color:#aeaeb2;width:20px;text-align:center;flex-shrink:0}
.staff-row select{flex:1;padding:7px 8px;border:1px solid #d2d2d7;border-radius:6px;font-size:15px;background:#fff;color:#1d1d1f;font-family:inherit}
.staff-row select:focus{outline:none;border-color:#007aff}
.nw-toggle{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:11px;color:#86868b;white-space:nowrap;-webkit-user-select:none}
.nw-toggle input{display:none}
.nw-toggle .sw{width:34px;height:20px;background:#d2d2d7;border-radius:10px;position:relative;transition:background .2s}
.nw-toggle .sw::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nw-toggle input:checked+.sw{background:#34c759}
.nw-toggle input:checked+.sw::after{transform:translateX(14px)}
.staff-times{display:grid;grid-template-columns:1fr 1fr 56px;gap:4px;margin-top:6px;margin-left:28px}
.staff-times.collapsed{display:none}
.staff-times input{width:100%;padding:6px;border:1px solid #d2d2d7;border-radius:6px;font-size:13px;text-align:center;background:#fff;font-family:inherit}
.staff-times input:focus{outline:none;border-color:#007aff}
.st-label{font-size:9px;color:#aeaeb2;text-align:center}

/* Check items */
.check-item{display:flex;align-items:center;gap:12px;padding:14px 20px}
.check-item+.check-item{border-top:.5px solid rgba(0,0,0,.06)}
.check-item input[type=checkbox]{width:22px;height:22px;accent-color:#007aff;flex-shrink:0}
.check-item label{flex:1;cursor:pointer;font-size:15px;color:#1d1d1f}

/* Confirm */
.confirm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:600;padding:20px;overflow-y:auto}
.confirm-overlay.show{display:flex;justify-content:center;align-items:flex-start}
.confirm-box{background:#fff;border-radius:14px;padding:24px;max-width:400px;width:100%;margin:auto}
.confirm-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:20px;letter-spacing:-.02em}
.confirm-section{background:#f5f5f7;border-radius:10px;padding:14px;margin-bottom:8px}
.confirm-section-title{font-size:11px;font-weight:600;color:#007aff;margin-bottom:6px}
.confirm-item{font-size:13px;color:#636366;padding:2px 0}
.confirm-buttons{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.confirm-back-btn{width:100%;padding:14px;background:#f5f5f7;color:#636366;border:none;border-radius:12px;font-size:17px;font-weight:500;cursor:pointer}
.confirm-send-btn{width:100%;padding:14px;background:#007aff;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer}
.confirm-send-btn:active{opacity:.75}
.confirm-send-btn:disabled{opacity:.3}

/* Done */
.done-screen{text-align:center;padding:100px 20px}
.done-icon{font-size:56px;margin-bottom:16px}
.done-title{font-size:24px;font-weight:700;letter-spacing:-.02em}
.done-subtitle{font-size:15px;color:#86868b;margin-top:6px}
.done-error{background:#fef2f2;color:#ff3b30;padding:12px;border-radius:10px;font-size:13px;margin-top:16px}
.done-btn{margin-top:32px;padding:14px 48px;background:#007aff;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer}

/* Booking */
.booking-block{border:1px solid #d2d2d7;border-radius:12px;padding:20px 16px 16px;margin-bottom:14px;position:relative;background:#fff}
.booking-number{position:absolute;top:-10px;left:16px;background:#ff3b30;color:#fff;font-size:11px;font-weight:600;padding:3px 12px;border-radius:8px}
.copy-check{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 10px;background:#fef2f2;border-radius:8px;font-size:13px;color:#ff3b30;font-weight:500;cursor:pointer}
.copy-check input[type=checkbox]{width:18px;height:18px;accent-color:#ff3b30}
.slot-payment{border-top:1px dashed #d2d2d7;margin:16px -16px -16px;padding:16px}
.rental-section{border-top:.5px solid rgba(0,0,0,.06);margin-top:12px;padding-top:12px}
.rental-title{font-size:11px;font-weight:600;color:#86868b;margin-bottom:8px}
.rental-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:#636366}
.rental-item+.rental-item{border-top:.5px solid rgba(0,0,0,.04)}
.rental-item .rental-label{flex:1}
.rental-item select{padding:4px 6px;border:1px solid #d2d2d7;border-radius:6px;font-size:13px;background:#fff;-webkit-appearance:none}
.slot-summary{border-top:1px solid #d2d2d7;margin-top:12px;padding-top:10px}
.slot-summary .summary-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:#636366}
.slot-summary .summary-row.rental{color:#af8700}
.slot-summary .summary-row.discount{color:#ff3b30}
.slot-summary .rental-detail{font-size:11px;color:#aeaeb2;padding:0 0 2px 8px}
.slot-summary .summary-total{display:flex;justify-content:space-between;padding:8px 0 0;margin-top:4px;border-top:2px solid #1d1d1f;font-size:17px;font-weight:700}
.grand-total-box{background:#1d1d1f;border-radius:12px;padding:20px;color:#fff;margin-bottom:14px}
.grand-total-box .gt-title{font-size:11px;color:#86868b}
.grand-total-box .gt-breakdown{font-size:13px;color:#d2d2d7;padding:2px 0}
.grand-total-box .gt-amount{font-size:34px;font-weight:700;text-align:center;padding:8px 0;letter-spacing:-.03em}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-selector{display:flex;gap:0;margin-bottom:16px;background:#f5f5f7;border-radius:8px;padding:2px}
.type-btn{flex:1;padding:10px 4px;border:none;border-radius:7px;background:transparent;font-size:15px;font-weight:600;text-align:center;cursor:pointer;color:#636366;transition:all .2s}
.type-btn.selected{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Cancel */
.cancel-toggle-row{margin-bottom:8px}
.cancel-toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#ff3b30;cursor:pointer}
.cancel-toggle input{width:18px;height:18px;accent-color:#ff3b30}
.cancelled-badge{background:#fef2f2;color:#ff3b30;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;margin-left:4px}
.teams-disabled{opacity:.25;pointer-events:none}

/* Sokketsu confirm */
.rep-confirm-box{background:#fef2f2;border-radius:12px;padding:16px;margin-bottom:16px;text-align:center}
.rep-confirm-box .rep-title{font-size:11px;color:#ff3b30;font-weight:600;margin-bottom:8px}
.rep-confirm-box .rep-name{font-size:20px;font-weight:700}
.rep-confirm-box .rep-email{font-size:13px;color:#86868b;word-break:break-all;margin-top:2px}
.btn-send-sokketsu{width:100%;padding:14px;border:none;border-radius:12px;background:#ff3b30;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.btn-send-sokketsu:disabled{opacity:.3}

/* Utility */
.hidden{display:none!important}
.empty-state{text-align:center;color:#aeaeb2;padding:32px;font-size:15px}
.error-banner{background:#fef2f2;color:#ff3b30;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
.error-banner.show{display:block}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">読み込み中</div>
</div>

<div class="confirm-overlay" id="report-confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">報告内容の確認</div>
    <div id="report-confirm-body"></div>
    <div class="confirm-buttons">
      <button class="confirm-send-btn" id="report-send-btn" onclick="doSubmitReport()">送信</button>
      <button class="confirm-back-btn" onclick="closeReportConfirm()">戻る</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="sokketsu-confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title" style="color:#1a73e8">この内容で送信しますか？</div>
    <div style="background:#fff3e0;border:2px solid #ff9800;border-radius:14px;padding:18px;margin-bottom:16px;text-align:center">
      <div style="font-size:13px;color:#e65100;font-weight:700;margin-bottom:10px">&#9888; この代表者に確認メールを送信します</div>
      <div style="font-size:20px;font-weight:700" id="sk-confirm-rep">-</div>
      <div style="font-size:13px;color:#86868b;word-break:break-all;margin-top:4px" id="sk-confirm-email">-</div>
    </div>
    <div id="sokketsu-confirm-body"></div>
    <div class="confirm-buttons">
      <button style="width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#e65100,#d32f2f);color:#fff;font-size:17px;font-weight:700;cursor:pointer" id="sokketsu-send-btn" onclick="doSubmitSokketsu()">代表者確認 - 送信する</button>
      <button class="confirm-back-btn" onclick="closeSokketsuConfirm()">戻って修正</button>
    </div>
  </div>
</div>

<div class="bs-overlay" id="bs-overlay" onclick="closeBottomSheet()"></div>
<div class="bottom-sheet" id="bottom-sheet">
  <div class="bs-handle"></div>
  <div id="bs-content"></div>
</div>

<div class="container">
  <div class="error-banner" id="error-banner"></div>

  <!-- 1: Venue Select -->
  <div id="screen-venue-select">
    <div class="header" style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <h1>現場運営</h1>
        <span class="badge" id="today-display">-</span>
      </div>
      <button onclick="goAdmin()" style="background:none;border:1px solid #d2d2d7;border-radius:8px;padding:6px 12px;font-size:12px;color:#86868b;cursor:pointer;margin-top:4px">管理</button>
    </div>
    <div class="section">
      <div class="section-inner">
        <div class="date-nav">
          <button class="date-btn" onclick="filterVenues('unreported')">未報告</button>
          <button class="date-btn" onclick="filterVenues('2daysago')">前々日</button>
          <button class="date-btn" onclick="filterVenues('yesterday')">前日</button>
          <button class="date-btn active" onclick="filterVenues('today')">本日</button>
          <button class="date-btn" onclick="filterVenues('tomorrow')">翌日</button>
        </div>
      </div>
      <div id="venue-list"><p class="empty-state">読み込み中</p></div>
    </div>
  </div>

  <!-- 2: Venue Dashboard -->
  <div id="screen-venue-dashboard" class="hidden">
    <button class="back-btn" onclick="goVenueSelect()">&#x2039; 会場選択</button>
    <div class="section">
      <div class="section-inner">
        <div class="section-title" id="venue-title">大会</div>
      </div>
      <div id="tournament-list"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button onclick="goHistoryScreen()" style="flex:1;padding:14px;background:#fff;color:#1d1d1f;border:1px solid #d2d2d7;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer" id="history-btn-dash">即決履歴 <span id="history-count-dash" style="color:#86868b"></span></button>
      <button class="report-btn" id="report-btn-dash" onclick="goReport()" style="flex:1;margin-top:0">報告を入力</button>
    </div>
  </div>

  <!-- 3a: History Screen (送信履歴スタイル) -->
  <div id="screen-history" class="hidden">
    <button class="back-btn" onclick="goVenueDashboard()">&#x2039; ダッシュボード</button>
    <div class="history-header">
      <h2>送信履歴</h2>
      <span class="count-badge" id="history-count-header">0件</span>
    </div>
    <div class="history-filter">
      <button id="filter-today" class="active" onclick="filterHistory('today')">本日</button>
      <button id="filter-3days" class="inactive" onclick="filterHistory('3days')">3日間</button>
    </div>
    <div id="history-list"><p class="empty-state">読み込み中</p></div>
  </div>

  <!-- 3b: Admin Screen -->
  <div id="screen-admin" class="hidden">
    <button class="back-btn" onclick="goVenueSelect()">&#x2039; トップ</button>
    <div class="header"><h1>管理</h1></div>
    <div class="section">
      <div class="section-inner">
        <div class="section-title">即決予約 (3日間)</div>
      </div>
      <div id="admin-history-list"><p class="empty-state">読み込み中</p></div>
    </div>
  </div>

  <!-- 3: Team List -->
  <div id="screen-team-list" class="hidden">
    <button class="back-btn" onclick="goVenueDashboard()">&#x2039; 大会一覧</button>
    <div class="sync-bar">
      <span class="sync-time" id="sync-time"></span>
      <button class="sync-btn" id="sync-btn" onclick="syncTeamData()"><span class="sync-icon">&#x21bb;</span>最新に更新</button>
    </div>
    <div class="section">
      <div class="section-inner">
        <div class="section-title" id="team-list-title">-</div>
      </div>
      <div id="team-list"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 4: Sokketsu -->
  <div id="screen-sokketsu" class="hidden">
    <button class="back-btn" onclick="goTeamList()">&#x2039; チーム一覧</button>
    <div style="background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:18px 16px;border-radius:14px;margin-bottom:14px;text-align:center">
      <div style="font-size:17px;font-weight:700">即決予約 入力フォーム</div>
      <div style="display:inline-block;background:rgba(255,255,255,.25);padding:4px 14px;border-radius:20px;font-size:13px;margin-top:6px" id="sk-team-badge">-</div>
    </div>
    <div class="section"><div class="section-inner">
      <div class="section-title">&#x1F3C0; 今回の大会</div>
      <div style="font-size:14px">
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.06)"><span style="color:#86868b;font-size:13px">チーム名</span><span style="font-weight:600;text-align:right;max-width:60%" id="sk-disp-team">-</span></div>
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.06)"><span style="color:#86868b;font-size:13px">代表者</span><span style="font-weight:600" id="sk-disp-rep">-</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.06)"><span style="color:#86868b;font-size:13px">メール</span><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:600;font-size:12px;word-break:break-all" id="sk-disp-email">-</span><button onclick="toggleEmailEdit()" style="padding:4px 10px;background:#f5f5f7;border:1px solid #d2d2d7;border-radius:6px;font-size:11px;color:#007aff;cursor:pointer" id="sk-email-toggle-btn">変更</button></div></div>
        <div id="sk-email-edit-row" style="display:none;padding:8px 0"><input type="email" id="sk-input-email" placeholder="メールアドレスを入力" inputmode="email" autocomplete="email" style="width:100%;padding:10px 12px;border:1px solid #d2d2d7;border-radius:8px;font-size:14px;background:#fff;font-family:inherit"></div>
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.06)"><span style="color:#86868b;font-size:13px">電話番号</span><span style="font-weight:600" id="sk-disp-phone">-</span></div>
        <div style="display:flex;justify-content:space-between;padding:10px 0"><span style="color:#86868b;font-size:13px">大会</span><span style="font-weight:600;font-size:12px;text-align:right;max-width:60%" id="sk-disp-tournament">-</span></div>
      </div>
    </div></div>
    <div class="section"><div class="section-inner">
      <div style="background:#e8f0fe;border-radius:10px;padding:12px 16px;margin-bottom:16px;text-align:center"><span style="font-size:15px;font-weight:700;color:#1a73e8">&#x1F4C5; 次回予約を入力</span></div>
      <div class="form-group"><label>入力者名 <span class="req">*</span></label><input type="text" id="sk-staff-name" placeholder="名前"></div>
      <div class="section-title">枠数</div>
      <div class="type-selector" id="sk-type-selector"></div>
      <div id="sk-booking-slots"></div>
    </div></div>
    <div class="grand-total-box" style="background:linear-gradient(135deg,#1a73e8,#0d47a1)">
      <div class="gt-title">合計</div>
      <div id="sk-total-breakdown"></div>
      <div class="gt-amount" id="sk-grand-total">-</div>
    </div>
    <div class="section"><div class="section-inner">
      <div class="form-group" style="margin:0"><label>備考（社内用）</label><textarea id="sk-remarks" placeholder="社内用メモ。メールには記載されません" rows="2" style="min-height:60px"></textarea></div>
    </div></div>
    <button class="btn-primary" style="margin-top:12px" onclick="showSokketsuConfirm()">確認画面へ</button>
    <button class="confirm-back-btn" style="margin-top:8px" onclick="goTeamList()">キャンセル</button>
  </div>

  <!-- 5: Report -->
  <div id="screen-report" class="hidden">
    <button class="back-btn" onclick="goVenueDashboard()">&#x2039; ダッシュボード</button>
    <div class="section"><div class="section-inner">
      <div class="section-title">報告者</div>
      <div class="form-group" style="margin:0"><label>名前 <span class="req">*</span></label><input type="text" id="report-staff-name" placeholder="名前"></div>
    </div></div>
    <div class="section"><div class="section-inner">
      <div class="section-title">運営報告</div>
      <div id="report-blocks-area"></div>
    </div></div>
    <div class="section"><div class="section-inner">
      <div class="section-title">スタッフ勤務</div>
      <div class="nw-box">
        <div class="nw-title">通常勤務</div>
        <div class="nw-inputs">
          <div><div class="nw-label">出勤</div><input type="time" id="nw-start" value="09:00"></div>
          <div><div class="nw-label">退勤</div><input type="time" id="nw-end" value="18:00"></div>
          <div><div class="nw-label">休憩</div><input type="number" id="nw-break" value="60" min="0" step="15"></div>
        </div>
        <button class="apply-btn" onclick="applyAllNormal()">全員に適用</button>
      </div>
      <div id="staff-area"></div>
    </div></div>
    <div class="section"><div class="section-inner">
      <div class="section-title">現場報告</div>
      <div class="form-group"><label>アクシデント</label><textarea id="accident-report" placeholder="事故・怪我・トラブル" style="min-height:200px"></textarea></div>
      <div class="form-group"><label>その他</label><textarea id="other-report" placeholder="連絡事項" style="min-height:200px"></textarea></div>
    </div></div>
    <div class="section">
      <div class="section-inner"><div class="section-title">最終チェック</div></div>
      <div id="check-items-area"></div>
    </div>
    <button class="report-btn" onclick="showReportConfirm()">報告を送信</button>
  </div>

  <!-- 6: Done -->
  <div id="screen-done" class="hidden">
    <div class="done-screen">
      <div class="done-icon">&#x2713;</div>
      <div class="done-title" id="done-title">完了</div>
      <div class="done-subtitle" id="done-subtitle"></div>
      <div class="done-error hidden" id="done-error"></div>
      <button class="done-btn" onclick="location.reload()">戻る</button>
    </div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbzejwlaQBa4v1sWbDhWhiSHDt3ydAhyydu_3sLqFTVYaP2PY3de4fVxCfA1JNVgYOSX/exec';
const LS_STAFF='dashboard_staff',LS_SK_STAFF='sokketsu_staff';
let venueData=null,selectedVenue=null,selectedVenueIndex=-1,selectedBlockIndex=-1,selectedTeamIndex=-1,currentFilter='today',currentHistoryFilter='today',isSending=false,skSlotCount=1,historyItems=[];

document.addEventListener('DOMContentLoaded',loadData);

function migrateReceptionFields(data){(data.venues||[]).forEach(function(v){(v.blocks||[]).forEach(function(b){(b.teams||[]).forEach(function(t){if(t.receptionStatus===undefined){if(t.receptionChecked===true||t.receptionChecked==='TRUE')t.receptionStatus='checked';else t.receptionStatus=''}})})})}
async function loadData(){showLoading('読み込み中');try{var r=await fetch(API_URL+'?action=getVenueReport');var d=await r.json();if(d.error){showError(d.error);return}migrateReceptionFields(d);venueData=d;document.getElementById('today-display').textContent=d.todayDisplay||'';renderVenueList()}catch(e){showError('取得失敗: '+e.message)}finally{hideLoading()}}

function showScreen(id){['screen-venue-select','screen-venue-dashboard','screen-team-list','screen-history','screen-admin','screen-sokketsu','screen-report','screen-done'].forEach(function(s){document.getElementById(s).classList.toggle('hidden',s!==id)});window.scrollTo(0,0)}
function goVenueSelect(){showScreen('screen-venue-select')}
function goVenueDashboard(){showScreen('screen-venue-dashboard')}
function goTeamList(){showScreen('screen-team-list')}

function filterVenues(f){currentFilter=f;var btns=document.querySelectorAll('.date-btn');var labels=['unreported','2daysago','yesterday','today','tomorrow'];btns.forEach(function(b,i){b.classList.toggle('active',labels[i]===f)});if(f==='unreported')loadUnreportedVenues();else renderVenueList()}

function renderVenueList(){var el=document.getElementById('venue-list');var venues=(venueData&&venueData.venues)||[];var filtered=venues.filter(function(v){if(currentFilter==='2daysago')return v.dayCategory==='2daysago';if(currentFilter==='yesterday')return v.dayCategory==='yesterday';if(currentFilter==='tomorrow')return v.dayCategory==='tomorrow';return v.dayCategory==='today'});if(!filtered.length){el.innerHTML='<p class="empty-state">会場はありません</p>';return}el.innerHTML=filtered.map(function(v){var ri=venues.indexOf(v);var bc=v.blockCount||(v.blocks||[]).length;return'<div class="card'+(v.completed?' done':'')+'" onclick="selectVenue('+ri+')"><div class="card-body"><div class="card-name">'+esc(v.sheetName.replace(/^\d+日\s*/,''))+'</div><div class="card-meta"><span>'+bc+'大会</span>'+(v.completed?'<span class="meta-badge green">報告済</span>':'')+'</div></div><span class="card-arrow">&#x203A;</span></div>'}).join('')}

function loadUnreportedVenues(){var el=document.getElementById('venue-list');el.innerHTML='<p class="empty-state">取得中...</p>';fetch(API_URL+'?action=getUnreported').then(function(r){return r.json()}).then(function(d){if(d.error){el.innerHTML='<p class="empty-state">'+esc(d.error)+'</p>';return}var list=d.unreported||[];if(!list.length){el.innerHTML='<p class="empty-state">未報告なし</p>';return}el.innerHTML=list.map(function(v){return'<div class="card" onclick="loadAndSelectVenue(\''+esc(v.spreadsheetId)+'\',\''+esc(v.sheetName)+'\')"><div class="card-body"><div class="card-name" style="color:#ff3b30">'+esc(v.sheetName.replace(/^\d+日\s*/,''))+'</div><div class="card-meta"><span>'+esc(v.dateStr)+'</span><span>'+v.blockCount+'大会</span><span class="meta-badge" style="color:#fff;background:#ff3b30">未報告</span></div></div><span class="card-arrow">&#x203A;</span></div>'}).join('')}).catch(function(e){el.innerHTML='<p class="empty-state">エラー</p>'})}

function loadAndSelectVenue(ssId,sn){var venues=(venueData&&venueData.venues)||[];
// 既にblocks付きで読み込み済みならそのまま遷移
for(var i=0;i<venues.length;i++){if(venues[i].spreadsheetId===ssId&&venues[i].sheetName===sn&&venues[i].blocks){selectedVenueIndex=i;selectedVenue=venues[i];renderVenueDashboard();loadHistory();showScreen('screen-venue-dashboard');return}}
showLoading('読み込み中');fetch(API_URL+'?action=getVenueBySheet&ssId='+encodeURIComponent(ssId)+'&sheetName='+encodeURIComponent(sn)).then(function(r){return r.json()}).then(function(d){hideLoading();if(d.error){showError(d.error);return}if(!venueData)venueData={venues:[]};if(!venueData.venues)venueData.venues=[];if(d.memberList)venueData.memberList=d.memberList;
// 既存venueを探して置き換え
var found=-1;for(var i=0;i<venueData.venues.length;i++){if(venueData.venues[i].spreadsheetId===ssId&&venueData.venues[i].sheetName===sn){found=i;break}}
if(found>=0){venueData.venues[found]=d.venue;selectedVenueIndex=found}else{venueData.venues.push(d.venue);selectedVenueIndex=venueData.venues.length-1}
selectedVenue=d.venue;(selectedVenue.blocks||[]).forEach(function(b){(b.teams||[]).forEach(function(t){if(t.receptionStatus===undefined){if(t.receptionChecked===true||t.receptionChecked==='TRUE')t.receptionStatus='checked';else t.receptionStatus=''}})});renderVenueDashboard();loadHistory();showScreen('screen-venue-dashboard')}).catch(function(e){hideLoading();showError(e.message)})}

function selectVenue(idx){selectedVenueIndex=idx;selectedVenue=venueData.venues[idx];renderVenueDashboard();loadHistory();showScreen('screen-venue-dashboard')}

function renderVenueDashboard(){var v=selectedVenue;document.getElementById('venue-title').textContent=v.sheetName;var blocks=v.blocks||[];var el=document.getElementById('tournament-list');if(!blocks.length){el.innerHTML='<p class="empty-state">大会なし</p>';return}el.innerHTML=blocks.map(function(b,bi){var tc=(b.teams||[]).length;var mt=b.maxTeams||'';var prizes=b.prizes||[];var pl=['優勝','副賞','GT'];var prizeHtml=prizes.length?'<div style="display:flex;flex-direction:column;gap:2px;margin-top:4px">'+prizes.map(function(p,pi){return'<span style="font-size:11px;color:#af8700">'+pl[pi]+': '+esc(p)+'</span>'}).join('')+'</div>':'';
var st={checked:0,cancel:0,unset:0,payWait:0,payDone:0};(b.teams||[]).forEach(function(t){if(t.receptionStatus==='checked')st.checked++;else if(t.receptionStatus==='cancel')st.cancel++;else st.unset++;if(t.receptionStatus!=='cancel'){var pay=String(t.payment||'');var isLP=(pay==='0'||pay==='false'||pay==='FALSE'||pay==='')&&t.price;if(isLP){if(t.paymentMethod==='端末決済'||t.paymentMethod==='決済済')st.payDone++;else st.payWait++}}});
var hasPayWait=st.payWait>0;var cardBg=hasPayWait?' style="background:#fef2f2"':'';
var statsHtml='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">';
if(st.checked)statsHtml+='<span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;color:#34c759;background:#f0fdf4">受付 '+st.checked+'</span>';
if(st.cancel)statsHtml+='<span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;color:#86868b;background:#f5f5f7">不参加 '+st.cancel+'</span>';
if(st.unset)statsHtml+='<span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;color:#86868b;background:#f5f5f7">未登録 '+st.unset+'</span>';
if(st.payWait)statsHtml+='<span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;color:#fff;background:#ff3b30">未決済 '+st.payWait+'</span>';
if(st.payDone)statsHtml+='<span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;color:#34c759;background:#f0fdf4">決済済 '+st.payDone+'</span>';
statsHtml+='</div>';
return'<div class="card"'+cardBg+' onclick="selectTournament('+bi+')"><div class="card-body"><div class="card-name">'+esc(b.tournamentName||'大会')+'</div><div class="card-meta">'+(b.startTime?'<span>('+esc(b.startTime)+')</span>':'')+'<span>'+tc+'チーム'+(mt?'('+esc(mt)+')':'')+'</span>'+(b.level?'<span>'+esc(b.level)+'</span>':'')+'</div>'+prizeHtml+statsHtml+'</div><span class="card-arrow">&#x203A;</span></div>'}).join('');updateReportButton()}

function updateReportButton(){var btn=document.getElementById('report-btn-dash');if(!btn||!selectedVenue)return;var blocks=selectedVenue.blocks||[];var unchecked=0,unpaid=0;blocks.forEach(function(b){(b.teams||[]).forEach(function(t){if(!t.receptionStatus||t.receptionStatus==='')unchecked++;if(t.receptionStatus==='checked'){var pay=String(t.payment||'');var isLocalPay=(pay==='0'||pay==='false'||pay==='FALSE'||pay==='')&&t.price;var localPayDone=t.paymentMethod==='端末決済'||t.paymentMethod==='決済済';if(isLocalPay&&!localPayDone)unpaid++}})});if(unchecked>0){btn.disabled=true;btn.textContent='受付未処理 '+unchecked+'チーム';btn.style.background='#ff3b30';btn.style.color='#fff'}else if(unpaid>0){btn.disabled=true;btn.textContent='決済未完了 '+unpaid+'チーム';btn.style.background='#ff3b30';btn.style.color='#fff'}else{btn.disabled=false;btn.textContent='報告を入力';btn.style.background='#34c759';btn.style.color='#fff'}}

async function doSubmitReport(){if(isSending)return;isSending=true;document.getElementById('report-send-btn').disabled=true;closeReportConfirm();showLoading('送信中');var blocks=selectedVenue.blocks||[];var teams=[];blocks.forEach(function(b,bi){(b.teams||[]).forEach(function(t,ti){teams.push({teamRow:t.teamRow,salesActivity:document.getElementById('rpt-sales-'+bi+'-'+ti).value,rank:document.getElementById('rpt-rank-'+bi+'-'+ti).value,remarks:document.getElementById('rpt-remarks-'+bi+'-'+ti).value,rentalInput:t.rentalInput||'',remittance:t.remittance||'',paymentMethod:t.paymentMethod||''})})});var staffList=[];var sa=selectedVenue.staffArea||{};var slots=sa.staff||[];for(var i=0;i<13;i++){var name=document.getElementById('sn-'+i).value.trim();var row=(slots[i]&&slots[i].row)?slots[i].row:(390+i);staffList.push({row:row,name:name,checkIn:document.getElementById('sci-'+i).value,checkOut:document.getElementById('sco-'+i).value,breakMin:parseInt(document.getElementById('sb-'+i).value)||0,normalWork:document.getElementById('snw-'+i).checked})}var checkItems=(sa.checkItems||[]).map(function(item,i){return{row:item.row,checked:document.getElementById('chk-'+i).checked}});var payload={action:'submitReport',staffName:document.getElementById('report-staff-name').value.trim(),spreadsheetId:selectedVenue.spreadsheetId,sheetName:selectedVenue.sheetName,teams:teams,staffList:staffList,accidentReport:document.getElementById('accident-report').value.trim(),otherReport:document.getElementById('other-report').value.trim(),checkItems:checkItems,markComplete:true};try{var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});var res=await r.json();hideLoading();isSending=false;document.getElementById('done-title').textContent='報告完了';document.getElementById('done-subtitle').textContent=selectedVenue.sheetName;var ee=document.getElementById('done-error');if(res.error){ee.textContent=res.error;ee.classList.remove('hidden')}else ee.classList.add('hidden');showScreen('screen-done')}catch(e){hideLoading();isSending=false;document.getElementById('report-send-btn').disabled=false;alert(e.message)}}

function showLoading(m){document.getElementById('loading-text').textContent=m||'';var el=document.getElementById('loading-overlay');el.classList.remove('hidden');el.style.opacity='1'}
function hideLoading(){document.getElementById('loading-overlay').classList.add('hidden')}
function showError(m){var el=document.getElementById('error-banner');el.textContent=m;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},5000)}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function fmtPhone(p){if(!p)return'';var s=String(p).replace(/[^0-9]/g,'');if(s&&s.charAt(0)!=='0')s='0'+s;return s}
function phoneLink(p){var n=fmtPhone(p);if(!n)return'-';return'<a href="tel:'+n+'" style="color:#007aff;text-decoration:none;font-weight:500" onclick="event.stopPropagation()">'+esc(n)+'</a>'}
</script>
</body>
</html>
