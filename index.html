<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BOOKS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Hiragino Sans',sans-serif;
  background:#f5f5f7;
  color:#1d1d1f;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}
.container{max-width:428px;margin:0 auto;padding:0 20px 120px}

/* ===== Loading ===== */
#loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#f5f5f7;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:28px;height:28px;border:2.5px solid #d2d2d7;border-top-color:#1d1d1f;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:16px;font-size:13px;color:#86868b;font-weight:500}

/* ===== Header ===== */
.header{padding:48px 0 20px;text-align:left}
.header h1{font-size:28px;font-weight:700;color:#1d1d1f;line-height:1.15;letter-spacing:-.03em}
.header .badge{font-size:15px;color:#86868b;font-weight:400;margin-top:4px;display:block;letter-spacing:-.01em}

/* ===== Section ===== */
.section{background:#fff;border-radius:12px;padding:0;margin-bottom:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.04)}
.section-inner{padding:20px}
.section-title{font-size:13px;font-weight:600;color:#86868b;margin-bottom:16px;letter-spacing:.02em}

/* ===== Date Filter ===== */
.date-nav{display:flex;gap:8px;margin-bottom:16px}
.date-btn{padding:8px 16px;border:none;border-radius:980px;background:transparent;font-size:13px;font-weight:600;color:#86868b;cursor:pointer;transition:all .2s}
.date-btn.active{background:#1d1d1f;color:#fff}
.date-btn:first-child.active{background:#ff3b30;color:#fff}
.date-btn:active{opacity:.7}

/* ===== Cards (common) ===== */
.card{display:flex;align-items:center;padding:14px 20px;cursor:pointer;transition:background .15s;position:relative}
.card:active{background:#f5f5f7}
.card+.card{border-top:1px solid #d2d2d7}
.card .card-body{flex:1;min-width:0}
.card .card-name{font-size:15px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .card-meta{font-size:12px;color:#86868b;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .card-arrow{color:#c7c7cc;font-size:13px;font-weight:300;margin-left:12px;flex-shrink:0}
.card.done{opacity:.6}
.meta-badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.meta-badge.green{color:#fff;background:#34c759}
.meta-badge.orange{color:#af8700;background:#fefce8}

/* Team */
.team-card{padding:16px 20px;cursor:pointer;transition:background .15s;border-left:3px solid transparent}
.team-card:active{background:#f5f5f7}
.team-card+.team-card{border-top:.5px solid rgba(0,0,0,.06)}
.team-card.s-green{border-left-color:#34c759}
.team-card.s-red{border-left-color:#ff3b30}
.team-card .t-row{display:flex;justify-content:space-between;align-items:center}
.team-card .t-row+.t-row{margin-top:6px}
.team-card .team-name{font-size:17px;font-weight:600}
.team-card .app-no{font-size:11px;color:#aeaeb2}
.team-card .rep-name{font-size:13px;color:#636366}
.team-card .phone{font-size:13px;color:#007aff;font-weight:500}
.team-card .rental-tag{font-size:11px;color:#af8700;background:#fefce8;padding:1px 6px;border-radius:4px;font-weight:500}
.team-card .price{font-size:15px;font-weight:700;letter-spacing:-.02em}
.team-card .pay-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.pay-badge.paid{color:#34c759;background:#f0fdf4}
.pay-badge.unpaid{color:#ff3b30;background:#fef2f2}
.pay-badge.unknown{color:#aeaeb2;background:#f5f5f7}
.team-card .sales-tag{font-size:11px;font-weight:600;color:#007aff;background:#eff6ff;padding:1px 6px;border-radius:4px}

/* ===== Back ===== */
.back-btn{display:inline-flex;align-items:center;gap:2px;color:#007aff;font-size:17px;font-weight:400;cursor:pointer;padding:12px 0;background:none;border:none}
.back-btn:active{opacity:.5}

/* ===== History ===== */
.history-item{padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.history-item+.history-item{border-top:.5px solid rgba(0,0,0,.06)}
.hi-time{font-size:11px;color:#aeaeb2}
.hi-team{font-size:15px;font-weight:600}
.hi-detail{font-size:13px;color:#aeaeb2}
.hi-status{display:flex;gap:4px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%}
.dot.ok{background:#34c759}
.dot.ng{background:#ff3b30}
.resend-btn{padding:5px 10px;background:#ff3b30;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.resend-btn:disabled{opacity:.3}

/* ===== Bottom Sheet ===== */
.bs-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:500}
.bs-overlay.show{display:block}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:#fff;border-radius:12px 12px 0 0;z-index:501;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom,24px)}
.bottom-sheet.show{transform:translateY(0)}
.bs-handle{width:36px;height:5px;background:#d2d2d7;border-radius:3px;margin:8px auto 4px}
.bs-head{padding:12px 20px 16px}
.bs-name{font-size:22px;font-weight:700;letter-spacing:-.02em}
.bs-sub{font-size:13px;color:#86868b;margin-top:2px}
.bs-close{position:absolute;right:16px;top:16px;width:30px;height:30px;background:#e5e5ea;border:none;border-radius:50%;font-size:12px;color:#636366;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bs-group{padding:0 20px 16px}
.bs-label{font-size:11px;font-weight:600;color:#86868b;margin-bottom:8px;letter-spacing:.02em}
.bs-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(0,0,0,.06);border-radius:10px;overflow:hidden}
.bs-cell{background:#fff;padding:12px}
.bs-cell-label{font-size:11px;color:#aeaeb2}
.bs-cell-value{font-size:15px;font-weight:600;margin-top:2px}
.bs-sep{height:.5px;background:rgba(0,0,0,.06);margin:0 20px 16px}
.bs-field{margin-bottom:12px}
.bs-field label{display:block;font-size:11px;font-weight:600;color:#86868b;margin-bottom:4px}
.bs-field select,.bs-field input{width:100%;padding:10px 12px;border:1px solid #d2d2d7;border-radius:8px;font-size:17px;background:#fff;color:#1d1d1f;font-family:inherit;-webkit-appearance:none}
.bs-field select:focus,.bs-field input:focus{outline:none;border-color:#007aff}
.bs-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bs-pay{background:#fffbeb;border-radius:10px;padding:14px;margin:0 20px 16px}
.bs-pay-title{font-size:11px;font-weight:600;color:#af8700;margin-bottom:8px}
.bs-btns{padding:0 20px 20px;display:flex;flex-direction:column;gap:8px}
.btn-primary{width:100%;padding:14px;background:#007aff;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:-.01em}
.btn-primary:active{opacity:.75}
.btn-primary:disabled{opacity:.3}
.btn-danger{width:100%;padding:14px;background:#ff3b30;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:-.01em}
.btn-danger:active{opacity:.75}

/* ===== Report ===== */
.report-btn{width:100%;padding:16px;background:#007aff;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;margin-top:12px;letter-spacing:-.01em}
.report-btn:active{opacity:.75}
.report-btn:disabled{opacity:.3}

/* ===== Forms ===== */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:#636366;margin-bottom:6px}
.form-group label .req{color:#ff3b30;font-size:11px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:1px solid #d2d2d7;border-radius:10px;font-size:17px;background:#fff;color:#1d1d1f;-webkit-appearance:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#007aff}
.form-group textarea{resize:vertical;min-height:88px;line-height:1.5}

/* Staff */
.nw-box{background:#f5f5f7;border-radius:10px;padding:14px;margin-bottom:16px}
.nw-title{font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:10px}
.nw-inputs{display:grid;grid-template-columns:1fr 1fr 72px;gap:8px;margin-bottom:10px}
.nw-inputs input{width:100%;padding:8px;border:1px solid #d2d2d7;border-radius:8px;font-size:15px;background:#fff;text-align:center;font-family:inherit;-webkit-appearance:none}
.nw-inputs input:focus{outline:none;border-color:#007aff}
.nw-label{font-size:11px;color:#86868b;text-align:center;margin-bottom:2px}
.apply-btn{width:100%;padding:10px;background:#007aff;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.apply-btn:active{opacity:.75}
.staff-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:.5px solid rgba(0,0,0,.06)}
.staff-row:last-child{border-bottom:none}
.staff-num{font-size:11px;color:#aeaeb2;width:20px;text-align:center;flex-shrink:0}
.staff-row select{flex:1;padding:7px 8px;border:1px solid #d2d2d7;border-radius:6px;font-size:15px;background:#fff;color:#1d1d1f;font-family:inherit}
.staff-row select:focus{outline:none;border-color:#007aff}
.nw-toggle{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:11px;color:#86868b;white-space:nowrap;-webkit-user-select:none}
.nw-toggle input{display:none}
.nw-toggle .sw{width:34px;height:20px;background:#d2d2d7;border-radius:10px;position:relative;transition:background .2s}
.nw-toggle .sw::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nw-toggle input:checked+.sw{background:#34c759}
.nw-toggle input:checked+.sw::after{transform:translateX(14px)}
.staff-times{display:grid;grid-template-columns:1fr 1fr 56px;gap:4px;margin-top:6px;margin-left:28px}
.staff-times.collapsed{display:none}
.staff-times input{width:100%;padding:6px;border:1px solid #d2d2d7;border-radius:6px;font-size:13px;text-align:center;background:#fff;font-family:inherit}
.staff-times input:focus{outline:none;border-color:#007aff}
.st-label{font-size:9px;color:#aeaeb2;text-align:center}

/* Check items */
.check-item{display:flex;align-items:center;gap:12px;padding:14px 20px}
.check-item+.check-item{border-top:.5px solid rgba(0,0,0,.06)}
.check-item input[type=checkbox]{width:22px;height:22px;accent-color:#007aff;flex-shrink:0}
.check-item label{flex:1;cursor:pointer;font-size:15px;color:#1d1d1f}

/* Confirm */
.confirm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:600;padding:20px;overflow-y:auto}
.confirm-overlay.show{display:flex;justify-content:center;align-items:flex-start}
.confirm-box{background:#fff;border-radius:14px;padding:24px;max-width:400px;width:100%;margin:auto}
.confirm-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:20px;letter-spacing:-.02em}
.confirm-section{background:#f5f5f7;border-radius:10px;padding:14px;margin-bottom:8px}
.confirm-section-title{font-size:11px;font-weight:600;color:#007aff;margin-bottom:6px}
.confirm-item{font-size:13px;color:#636366;padding:2px 0}
.confirm-buttons{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.confirm-back-btn{width:100%;padding:14px;background:#f5f5f7;color:#636366;border:none;border-radius:12px;font-size:17px;font-weight:500;cursor:pointer}
.confirm-send-btn{width:100%;padding:14px;background:#007aff;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer}
.confirm-send-btn:active{opacity:.75}
.confirm-send-btn:disabled{opacity:.3}

/* Done */
.done-screen{text-align:center;padding:100px 20px}
.done-icon{font-size:56px;margin-bottom:16px}
.done-title{font-size:24px;font-weight:700;letter-spacing:-.02em}
.done-subtitle{font-size:15px;color:#86868b;margin-top:6px}
.done-error{background:#fef2f2;color:#ff3b30;padding:12px;border-radius:10px;font-size:13px;margin-top:16px}
.done-btn{margin-top:32px;padding:14px 48px;background:#007aff;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer}

/* Booking */
.booking-block{border:1px solid #d2d2d7;border-radius:12px;padding:20px 16px 16px;margin-bottom:14px;position:relative;background:#fff}
.booking-number{position:absolute;top:-10px;left:16px;background:#ff3b30;color:#fff;font-size:11px;font-weight:600;padding:3px 12px;border-radius:8px}
.copy-check{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 10px;background:#fef2f2;border-radius:8px;font-size:13px;color:#ff3b30;font-weight:500;cursor:pointer}
.copy-check input[type=checkbox]{width:18px;height:18px;accent-color:#ff3b30}
.slot-payment{border-top:1px dashed #d2d2d7;margin:16px -16px -16px;padding:16px}
.rental-section{border-top:.5px solid rgba(0,0,0,.06);margin-top:12px;padding-top:12px}
.rental-title{font-size:11px;font-weight:600;color:#86868b;margin-bottom:8px}
.rental-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:#636366}
.rental-item+.rental-item{border-top:.5px solid rgba(0,0,0,.04)}
.rental-item .rental-label{flex:1}
.rental-item select{padding:4px 6px;border:1px solid #d2d2d7;border-radius:6px;font-size:13px;background:#fff;-webkit-appearance:none}
.slot-summary{border-top:1px solid #d2d2d7;margin-top:12px;padding-top:10px}
.slot-summary .summary-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:#636366}
.slot-summary .summary-row.rental{color:#af8700}
.slot-summary .summary-row.discount{color:#ff3b30}
.slot-summary .rental-detail{font-size:11px;color:#aeaeb2;padding:0 0 2px 8px}
.slot-summary .summary-total{display:flex;justify-content:space-between;padding:8px 0 0;margin-top:4px;border-top:2px solid #1d1d1f;font-size:17px;font-weight:700}
.grand-total-box{background:#1d1d1f;border-radius:12px;padding:20px;color:#fff;margin-bottom:14px}
.grand-total-box .gt-title{font-size:11px;color:#86868b}
.grand-total-box .gt-breakdown{font-size:13px;color:#d2d2d7;padding:2px 0}
.grand-total-box .gt-amount{font-size:34px;font-weight:700;text-align:center;padding:8px 0;letter-spacing:-.03em}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-selector{display:flex;gap:0;margin-bottom:16px;background:#f5f5f7;border-radius:8px;padding:2px}
.type-btn{flex:1;padding:10px 4px;border:none;border-radius:7px;background:transparent;font-size:15px;font-weight:600;text-align:center;cursor:pointer;color:#636366;transition:all .2s}
.type-btn.selected{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Cancel */
.cancel-toggle-row{margin-bottom:8px}
.cancel-toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#ff3b30;cursor:pointer}
.cancel-toggle input{width:18px;height:18px;accent-color:#ff3b30}
.cancelled-badge{background:#fef2f2;color:#ff3b30;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;margin-left:4px}
.teams-disabled{opacity:.25;pointer-events:none}

/* Sokketsu confirm */
.rep-confirm-box{background:#fef2f2;border-radius:12px;padding:16px;margin-bottom:16px;text-align:center}
.rep-confirm-box .rep-title{font-size:11px;color:#ff3b30;font-weight:600;margin-bottom:8px}
.rep-confirm-box .rep-name{font-size:20px;font-weight:700}
.rep-confirm-box .rep-email{font-size:13px;color:#86868b;word-break:break-all;margin-top:2px}
.btn-send-sokketsu{width:100%;padding:14px;border:none;border-radius:12px;background:#ff3b30;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.btn-send-sokketsu:disabled{opacity:.3}

/* Utility */
.hidden{display:none!important}
.empty-state{text-align:center;color:#aeaeb2;padding:32px;font-size:15px}
.error-banner{background:#fef2f2;color:#ff3b30;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
.error-banner.show{display:block}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">読み込み中</div>
</div>

<div class="confirm-overlay" id="report-confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">報告内容の確認</div>
    <div id="report-confirm-body"></div>
    <div class="confirm-buttons">
      <button class="confirm-send-btn" id="report-send-btn" onclick="doSubmitReport()">送信</button>
      <button class="confirm-back-btn" onclick="closeReportConfirm()">戻る</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="sokketsu-confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">予約内容の確認</div>
    <div class="rep-confirm-box">
      <div class="rep-title">確認メール送信先</div>
      <div class="rep-name" id="sk-confirm-rep">-</div>
      <div class="rep-email" id="sk-confirm-email">-</div>
    </div>
    <div id="sokketsu-confirm-body"></div>
    <div class="confirm-buttons">
      <button class="btn-send-sokketsu" id="sokketsu-send-btn" onclick="doSubmitSokketsu()">送信</button>
      <button class="confirm-back-btn" onclick="closeSokketsuConfirm()">戻る</button>
    </div>
  </div>
</div>

<div class="bs-overlay" id="bs-overlay" onclick="closeBottomSheet()"></div>
<div class="bottom-sheet" id="bottom-sheet">
  <div class="bs-handle"></div>
  <div id="bs-content"></div>
</div>

<div class="container">
  <div class="error-banner" id="error-banner"></div>

  <!-- 1: Venue Select -->
  <div id="screen-venue-select">
    <div class="header">
      <h1>現場運営</h1>
      <span class="badge" id="today-display">-</span>
    </div>
    <div class="section">
      <div class="section-inner">
        <div class="date-nav">
          <button class="date-btn" onclick="filterVenues('unreported')">未報告</button>
          <button class="date-btn" onclick="filterVenues('yesterday')">前日</button>
          <button class="date-btn active" onclick="filterVenues('today')">本日</button>
          <button class="date-btn" onclick="filterVenues('tomorrow')">翌日</button>
        </div>
      </div>
      <div id="venue-list"><p class="empty-state">読み込み中</p></div>
    </div>
  </div>

  <!-- 2: Venue Dashboard -->
  <div id="screen-venue-dashboard" class="hidden">
    <button class="back-btn" onclick="goVenueSelect()">&#x2039; 会場選択</button>
    <div class="section">
      <div class="section-inner">
        <div class="section-title" id="venue-title">大会</div>
      </div>
      <div id="tournament-list"></div>
    </div>
    <div class="section">
      <div class="section-inner">
        <div class="section-title">即決予約</div>
      </div>
      <div id="history-list"><p class="empty-state">読み込み中</p></div>
    </div>
    <button class="report-btn" onclick="goReport()">報告を入力</button>
  </div>

  <!-- 3: Team List -->
  <div id="screen-team-list" class="hidden">
    <button class="back-btn" onclick="goVenueDashboard()">&#x2039; 大会一覧</button>
    <div class="section">
      <div class="section-inner">
        <div class="section-title" id="team-list-title">-</div>
      </div>
      <div id="team-list"></div>
    </div>
  </div>

  <!-- 4: Sokketsu -->
  <div id="screen-sokketsu" class="hidden">
    <button class="back-btn" onclick="goTeamList()">&#x2039; チーム一覧</button>
    <div class="header" style="background:#ff3b30">
      <h1>即決予約</h1>
      <span class="badge" id="sk-team-badge">-</span>
    </div>
    <div class="section"><div class="section-inner">
      <div class="section-title">チーム</div>
      <div class="bs-grid">
        <div class="bs-cell"><div class="bs-cell-label">チーム</div><div class="bs-cell-value" id="sk-disp-team">-</div></div>
        <div class="bs-cell"><div class="bs-cell-label">代表者</div><div class="bs-cell-value" id="sk-disp-rep">-</div></div>
        <div class="bs-cell"><div class="bs-cell-label">電話番号</div><div class="bs-cell-value" id="sk-disp-phone">-</div></div>
        <div class="bs-cell"><div class="bs-cell-label">メール</div><div class="bs-cell-value" id="sk-disp-email" style="font-size:11px;word-break:break-all">-</div></div>
      </div>
    </div></div>
    <div class="section"><div class="section-inner">
      <div class="section-title">枠数</div>
      <div class="type-selector" id="sk-type-selector"></div>
      <div class="form-group"><label>入力者名 <span class="req">*</span></label><input type="text" id="sk-staff-name" placeholder="名前"></div>
      <div id="sk-booking-slots"></div>
    </div></div>
    <div class="grand-total-box">
      <div class="gt-title">合計</div>
      <div id="sk-total-breakdown"></div>
      <div class="gt-amount" id="sk-grand-total">-</div>
    </div>
    <button class="btn-danger" onclick="showSokketsuConfirm()">確認画面へ</button>
    <button class="confirm-back-btn" style="margin-top:8px" onclick="goTeamList()">キャンセル</button>
  </div>

  <!-- 5: Report -->
  <div id="screen-report" class="hidden">
    <button class="back-btn" onclick="goVenueDashboard()">&#x2039; ダッシュボード</button>
    <div class="section"><div class="section-inner">
      <div class="section-title">報告者</div>
      <div class="form-group" style="margin:0"><label>名前 <span class="req">*</span></label><input type="text" id="report-staff-name" placeholder="名前"></div>
    </div></div>
    <div class="section"><div class="section-inner">
      <div class="section-title">運営報告</div>
      <div id="report-blocks-area"></div>
    </div></div>
    <div class="section"><div class="section-inner">
      <div class="section-title">スタッフ勤務</div>
      <div class="nw-box">
        <div class="nw-title">通常勤務</div>
        <div class="nw-inputs">
          <div><div class="nw-label">出勤</div><input type="time" id="nw-start" value="09:00"></div>
          <div><div class="nw-label">退勤</div><input type="time" id="nw-end" value="18:00"></div>
          <div><div class="nw-label">休憩</div><input type="number" id="nw-break" value="60" min="0" step="15"></div>
        </div>
        <button class="apply-btn" onclick="applyAllNormal()">全員に適用</button>
      </div>
      <div id="staff-area"></div>
    </div></div>
    <div class="section"><div class="section-inner">
      <div class="section-title">現場報告</div>
      <div class="form-group"><label>アクシデント</label><textarea id="accident-report" placeholder="事故・怪我・トラブル"></textarea></div>
      <div class="form-group"><label>その他</label><textarea id="other-report" placeholder="連絡事項"></textarea></div>
    </div></div>
    <div class="section">
      <div class="section-inner"><div class="section-title">最終チェック</div></div>
      <div id="check-items-area"></div>
    </div>
    <button class="report-btn" onclick="showReportConfirm()">報告を送信</button>
  </div>

  <!-- 6: Done -->
  <div id="screen-done" class="hidden">
    <div class="done-screen">
      <div class="done-icon">&#x2713;</div>
      <div class="done-title" id="done-title">完了</div>
      <div class="done-subtitle" id="done-subtitle"></div>
      <div class="done-error hidden" id="done-error"></div>
      <button class="done-btn" onclick="location.reload()">戻る</button>
    </div>
  </div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbzejwlaQBa4v1sWbDhWhiSHDt3ydAhyydu_3sLqFTVYaP2PY3de4fVxCfA1JNVgYOSX/exec';
const LS_STAFF='dashboard_staff',LS_SK_STAFF='sokketsu_staff';
let venueData=null,selectedVenue=null,selectedVenueIndex=-1,selectedBlockIndex=-1,selectedTeamIndex=-1,currentFilter='today',isSending=false,skSlotCount=1,historyItems=[];

document.addEventListener('DOMContentLoaded',loadData);

async function loadData(){showLoading('読み込み中');try{var r=await fetch(API_URL+'?action=getVenueReport');var d=await r.json();if(d.error){showError(d.error);return}venueData=d;document.getElementById('today-display').textContent=d.todayDisplay||'';renderVenueList()}catch(e){showError('取得失敗: '+e.message)}finally{hideLoading()}}

function showScreen(id){['screen-venue-select','screen-venue-dashboard','screen-team-list','screen-sokketsu','screen-report','screen-done'].forEach(function(s){document.getElementById(s).classList.toggle('hidden',s!==id)});window.scrollTo(0,0)}
function goVenueSelect(){showScreen('screen-venue-select')}
function goVenueDashboard(){showScreen('screen-venue-dashboard')}
function goTeamList(){showScreen('screen-team-list')}

function filterVenues(f){currentFilter=f;var btns=document.querySelectorAll('.date-btn');var labels=['unreported','yesterday','today','tomorrow'];btns.forEach(function(b,i){b.classList.toggle('active',labels[i]===f)});if(f==='unreported')loadUnreportedVenues();else renderVenueList()}

function renderVenueList(){var el=document.getElementById('venue-list');var venues=(venueData&&venueData.venues)||[];var filtered=venues.filter(function(v){if(currentFilter==='yesterday')return v.dayCategory==='yesterday';if(currentFilter==='tomorrow')return v.dayCategory==='tomorrow';return v.dayCategory==='today'});if(!filtered.length){el.innerHTML='<p class="empty-state">会場はありません</p>';return}el.innerHTML=filtered.map(function(v){var ri=venues.indexOf(v);var bc=(v.blocks||[]).length;return'<div class="card'+(v.completed?' done':'')+'" onclick="selectVenue('+ri+')"><div class="card-body"><div class="card-name">'+esc(v.sheetName.replace(/^\d+日\s*/,''))+'</div><div class="card-meta"><span>'+bc+'大会</span>'+(v.completed?'<span class="meta-badge green">報告済</span>':'')+'</div></div><span class="card-arrow">&#x203A;</span></div>'}).join('')}

function loadUnreportedVenues(){var el=document.getElementById('venue-list');el.innerHTML='<p class="empty-state">取得中...</p>';fetch(API_URL+'?action=getUnreported').then(function(r){return r.json()}).then(function(d){if(d.error){el.innerHTML='<p class="empty-state">'+esc(d.error)+'</p>';return}var list=d.unreported||[];if(!list.length){el.innerHTML='<p class="empty-state">未報告なし</p>';return}el.innerHTML=list.map(function(v){return'<div class="card" onclick="loadAndSelectVenue(\''+esc(v.spreadsheetId)+'\',\''+esc(v.sheetName)+'\')"><div class="card-body"><div class="card-name" style="color:#ff3b30">'+esc(v.sheetName.replace(/^\d+日\s*/,''))+'</div><div class="card-meta"><span>'+esc(v.dateStr)+'</span><span>'+v.blockCount+'大会</span><span class="meta-badge" style="color:#fff;background:#ff3b30">未報告</span></div></div><span class="card-arrow">&#x203A;</span></div>'}).join('')}).catch(function(e){el.innerHTML='<p class="empty-state">エラー</p>'})}

function loadAndSelectVenue(ssId,sn){var venues=(venueData&&venueData.venues)||[];for(var i=0;i<venues.length;i++){if(venues[i].spreadsheetId===ssId&&venues[i].sheetName===sn){selectVenue(i);return}}showLoading('読み込み中');fetch(API_URL+'?action=getVenueBySheet&ssId='+encodeURIComponent(ssId)+'&sheetName='+encodeURIComponent(sn)).then(function(r){return r.json()}).then(function(d){hideLoading();if(d.error){showError(d.error);return}if(!venueData)venueData={venues:[]};if(!venueData.venues)venueData.venues=[];venueData.venues.push(d.venue);if(d.memberList)venueData.memberList=d.memberList;selectVenue(venueData.venues.length-1)}).catch(function(e){hideLoading();showError(e.message)})}

function selectVenue(idx){selectedVenueIndex=idx;selectedVenue=venueData.venues[idx];renderVenueDashboard();loadHistory();showScreen('screen-venue-dashboard')}

function renderVenueDashboard(){var v=selectedVenue;document.getElementById('venue-title').textContent=v.sheetName;var blocks=v.blocks||[];var el=document.getElementById('tournament-list');if(!blocks.length){el.innerHTML='<p class="empty-state">大会なし</p>';return}el.innerHTML=blocks.map(function(b,bi){var tc=(b.teams||[]).length;var prizes=b.prizes||[];var pl=['優勝','副賞','GT'];var prizeHtml=prizes.length?'<div style="display:flex;flex-direction:column;gap:2px;margin-top:4px">'+prizes.map(function(p,pi){return'<span style="font-size:11px;color:#af8700">'+pl[pi]+': '+esc(p)+'</span>'}).join('')+'</div>':'';return'<div class="card" onclick="selectTournament('+bi+')"><div class="card-body"><div class="card-name">'+esc(b.tournamentName||'大会')+'</div><div class="card-meta">'+(b.startTime?'<span>('+esc(b.startTime)+')</span>':'')+'<span>'+tc+'チーム</span></div>'+prizeHtml+'</div><span class="card-arrow">&#x203A;</span></div>'}).join('')}

function loadHistory(){var el=document.getElementById('history-list');el.innerHTML='<p class="empty-state">読み込み中</p>';fetch(API_URL+'?action=getHistory').then(function(r){return r.json()}).then(function(d){historyItems=d.items||[];renderHistory()}).catch(function(){el.innerHTML='<p class="empty-state">取得失敗</p>'})}

function renderHistory(){var el=document.getElementById('history-list');if(!historyItems.length){el.innerHTML='<p class="empty-state">なし</p>';return}el.innerHTML=historyItems.map(function(h,i){return'<div class="history-item"><div><div class="hi-time">'+esc(h.time)+'</div><div class="hi-team">'+esc(h.team)+'</div><div class="hi-detail">'+h.slotCount+'枠</div></div><div class="hi-status"><div class="dot '+(h.cwOk?'ok':'ng')+'"></div><div class="dot '+(h.emailOk?'ok':'ng')+'"></div>'+(!h.emailOk?'<button class="resend-btn" id="resend-'+i+'" onclick="resendEmail('+i+')">再送</button>':'')+'</div></div>'}).join('')}

async function resendEmail(idx){var h=historyItems[idx];var btn=document.getElementById('resend-'+idx);if(!h||!btn)return;btn.disabled=true;btn.textContent='...';try{var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'resendEmail',email:h.email,rep:h.rep,team:h.team,phone:h.phone})});var res=await r.json();if(res.email==='OK'){btn.textContent='完了';btn.style.background='#34c759'}else{btn.textContent='失敗';btn.disabled=false}}catch(e){btn.textContent='失敗';btn.disabled=false}}

function selectTournament(bi){selectedBlockIndex=bi;renderTeamList();showScreen('screen-team-list')}

function renderTeamList(){var b=selectedVenue.blocks[selectedBlockIndex];var prizes=b.prizes||[];var pl2=['優勝','副賞','GT'];var prizeHtml2=prizes.length?'<div style="display:flex;flex-direction:column;gap:2px;margin-top:4px">'+prizes.map(function(p,pi){return'<span style="font-size:11px;color:#af8700">'+pl2[pi]+': '+esc(p)+'</span>'}).join('')+'</div>':'';document.getElementById('team-list-title').innerHTML=esc(b.tournamentName||'大会')+'<div class="card-meta" style="margin-top:4px;font-weight:400">'+(b.startTime?'<span>('+esc(b.startTime)+')</span>':'')+'<span>'+(b.teams||[]).length+'チーム</span></div>'+prizeHtml2;var el=document.getElementById('team-list');var teams=b.teams||[];if(!teams.length){el.innerHTML='<p class="empty-state">チームなし</p>';return}el.innerHTML=teams.map(function(t,ti){var price=t.price?'\xA5'+Number(String(t.price).replace(/[^0-9]/g,'')).toLocaleString():'';var rd=t.rentalInput||t.rental||'';var rem=t.remittance?'\xA5'+Number(String(t.remittance).replace(/[^0-9]/g,'')).toLocaleString():'';var pm=t.paymentMethod||'';var sc='',sl='-',sbc='unknown';if(pm){sc='s-green';sl=pm;sbc='paid'}else if(price){sc='s-red';sl='未入力';sbc='unpaid'}var sb=t.salesActivity?'<span class="sales-tag">'+esc(t.salesActivity)+'</span>':'';return'<div class="team-card '+sc+'" onclick="openTeamDetail('+ti+')"><div class="t-row"><span class="team-name">'+esc(t.teamName)+'</span><span class="app-no">#'+esc(t.applicationNo)+'</span></div><div class="t-row"><span class="rep-name">'+esc(t.rep||'-')+'</span><span class="phone">'+phoneLink(t.phone)+'</span></div><div class="t-row">'+(rd?'<span class="rental-tag">'+esc(rd)+'</span>':'<span style="color:#d2d2d7;font-size:11px">-</span>')+sb+'<span class="price">'+(rem||price)+'</span><span class="pay-badge '+sbc+'">'+sl+'</span></div></div>'}).join('')}

function openTeamDetail(ti){selectedTeamIndex=ti;var b=selectedVenue.blocks[selectedBlockIndex];var t=b.teams[ti];var price=t.price?'\xA5'+Number(String(t.price).replace(/[^0-9]/g,'')).toLocaleString():'-';var h='<div class="bs-head" style="position:relative"><div class="bs-name">'+esc(t.teamName)+'</div><div class="bs-sub">#'+esc(t.applicationNo)+' '+esc(b.tournamentName||'')+'</div><button class="bs-close" onclick="closeBottomSheet()">&#x2715;</button></div>';h+='<div class="bs-group"><div class="bs-label">情報</div><div class="bs-grid"><div class="bs-cell"><div class="bs-cell-label">代表者</div><div class="bs-cell-value">'+esc(t.rep||'-')+'</div></div><div class="bs-cell"><div class="bs-cell-label">フリガナ</div><div class="bs-cell-value">'+esc(t.furigana||'-')+'</div></div><div class="bs-cell"><div class="bs-cell-label">電話番号</div><div class="bs-cell-value" style="color:#007aff">'+phoneLink(t.phone)+'</div></div><div class="bs-cell"><div class="bs-cell-label">申請番号</div><div class="bs-cell-value">'+esc(t.applicationNo||'-')+'</div></div><div class="bs-cell"><div class="bs-cell-label">レンタル(DB)</div><div class="bs-cell-value" style="color:#af8700">'+esc(t.rental||'なし')+'</div></div><div class="bs-cell"><div class="bs-cell-label">参加費</div><div class="bs-cell-value" style="font-size:17px">'+price+'</div></div></div></div>';h+='<div class="bs-sep"></div>';h+='<div class="bs-group"><div class="bs-label">運営入力</div><div class="bs-row"><div class="bs-field"><label>営業</label>'+buildSelect('bs-sales',['','なし','即決1','即決2','即決3','即決4','即決5'],t.salesActivity)+'</div><div class="bs-field"><label>順位</label>'+buildSelect('bs-rank',['','1位','2位','3位','4位','5位','6位以下'],t.rank)+'</div></div><div class="bs-field"><label>備考</label><input type="text" id="bs-remarks" value="'+esc(t.remarks||'')+'" placeholder="備考"></div></div>';h+='<div class="bs-pay"><div class="bs-pay-title">受取・レンタル</div><div class="bs-field"><label>レンタル内容</label><input type="text" id="bs-rental-input" value="'+esc(t.rentalInput||'')+'" placeholder="ビブス2セット, ボール1球"></div><div class="bs-row"><div class="bs-field"><label>送金額</label><input type="number" id="bs-remittance" inputmode="numeric" value="'+esc(t.remittance||'')+'" placeholder="金額" style="font-weight:700"></div><div class="bs-field"><label>受取方法</label><select id="bs-payment-method"><option value=""'+(!t.paymentMethod?' selected':'')+'>---</option><option value="現金"'+(t.paymentMethod==='現金'?' selected':'')+'>現金</option><option value="端末決済"'+(t.paymentMethod==='端末決済'?' selected':'')+'>端末決済</option></select></div></div></div>';h+='<div class="bs-btns"><button class="btn-primary" onclick="saveTeamData()">保存</button><button class="btn-danger" onclick="goSokketsu()">即決予約</button></div>';document.getElementById('bs-content').innerHTML=h;document.getElementById('bs-overlay').classList.add('show');setTimeout(function(){document.getElementById('bottom-sheet').classList.add('show')},10)}

function closeBottomSheet(){document.getElementById('bottom-sheet').classList.remove('show');setTimeout(function(){document.getElementById('bs-overlay').classList.remove('show')},300)}
function buildSelect(id,opts,sel){var h='<select id="'+id+'">';opts.forEach(function(o){h+='<option value="'+esc(o)+'"'+(o===sel?' selected':'')+'>'+(o||'---')+'</option>'});return h+'</select>'}

async function saveTeamData(){var b=selectedVenue.blocks[selectedBlockIndex];var t=b.teams[selectedTeamIndex];var sv=document.getElementById('bs-sales').value,rv=document.getElementById('bs-rank').value,rm=document.getElementById('bs-remarks').value,ri=document.getElementById('bs-rental-input').value,re=document.getElementById('bs-remittance').value,pm=document.getElementById('bs-payment-method').value;t.salesActivity=sv;t.rank=rv;t.remarks=rm;t.rentalInput=ri;t.remittance=re;t.paymentMethod=pm;showLoading('保存中');try{var p={action:'submitReport',spreadsheetId:selectedVenue.spreadsheetId,sheetName:selectedVenue.sheetName,teams:[{teamRow:t.teamRow,salesActivity:sv,rank:rv,remarks:rm,rentalInput:ri,remittance:re,paymentMethod:pm}],staffList:[],markComplete:false};var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)});var res=await r.json();hideLoading();if(res.error){alert(res.error);return}closeBottomSheet();renderTeamList()}catch(e){hideLoading();alert(e.message)}}

function goSokketsu(){closeBottomSheet();var b=selectedVenue.blocks[selectedBlockIndex];var t=b.teams[selectedTeamIndex];document.getElementById('sk-team-badge').textContent=t.teamName;document.getElementById('sk-disp-team').textContent=t.teamName;document.getElementById('sk-disp-rep').textContent=t.rep||'-';document.getElementById('sk-disp-phone').textContent=t.phone||'-';document.getElementById('sk-disp-email').textContent=t.email||'(取得中)';fetchTeamEmail(t);var saved=localStorage.getItem(LS_SK_STAFF);if(saved)document.getElementById('sk-staff-name').value=saved;skSlotCount=1;var ts=document.getElementById('sk-type-selector');ts.innerHTML='';for(var i=1;i<=5;i++)ts.innerHTML+='<div class="type-btn'+(i===1?' selected':'')+'" onclick="selectSkType('+i+')">'+i+'</div>';renderSkSlots();showScreen('screen-sokketsu')}

async function fetchTeamEmail(team){try{var r=await fetch(API_URL+'?action=getTournaments');var d=await r.json();var ts=d.tournaments||[];for(var ti=0;ti<ts.length;ti++){var tms=ts[ti].teams||[];for(var j=0;j<tms.length;j++){if(tms[j].team===team.teamName){team.email=tms[j].email||'';team.realEmail=tms[j].realEmail||tms[j].email||'';document.getElementById('sk-disp-email').textContent=team.email||'(なし)';return}}}document.getElementById('sk-disp-email').textContent='(未取得)'}catch(e){document.getElementById('sk-disp-email').textContent='(失敗)'}}

function selectSkType(n){skSlotCount=n;document.querySelectorAll('#sk-type-selector .type-btn').forEach(function(b,i){b.classList.toggle('selected',i===n-1)});renderSkSlots()}

function renderSkSlots(){var c=document.getElementById('sk-booking-slots');var h='';for(var i=1;i<=skSlotCount;i++){h+='<div class="booking-block"><div class="booking-number">予約'+i+'</div>';if(i>1)h+='<label class="copy-check"><input type="checkbox" id="sk-copy'+i+'" onchange="skApplyCopy('+i+')">予約1と同じ</label>';h+='<div class="form-group"><label>日付 <span class="req">*</span></label><input type="date" id="sk-date'+i+'"></div><div class="form-group"><label>会場 <span class="req">*</span></label><input type="text" id="sk-venue'+i+'" placeholder="会場名"></div><div class="form-row"><div class="form-group"><label>受付 <span class="req">*</span></label><input type="text" id="sk-time'+i+'" placeholder="10:00"></div><div class="form-group"><label>レベル <span class="req">*</span></label><input type="text" id="sk-level'+i+'" placeholder="エンジョイ"></div></div><div class="slot-payment"><div class="form-group"><label>金額 <span class="req">*</span></label><input type="number" id="sk-price'+i+'" placeholder="17000" inputmode="numeric" oninput="skCalcTotal()"></div><div class="form-group"><label>クーポン</label><select id="sk-coupon'+i+'" onchange="skCalcTotal()"><option value="0">なし</option>';[1000,2000,3000,4000,5000,8000].forEach(function(v){h+='<option value="'+v+'">'+v.toLocaleString()+'円引</option>'});h+='</select></div><div class="rental-section"><div class="rental-title">レンタル</div><div class="rental-item"><span class="rental-label">ビブス(\xA51,000)</span><select id="sk-bib'+i+'" onchange="skCalcTotal()" style="width:60px">';for(var bn=0;bn<=10;bn++)h+='<option value="'+bn+'">'+bn+'</option>';h+='</select></div><div class="rental-item"><span class="rental-label">ボール(\xA5500)</span><select id="sk-ball'+i+'" onchange="skCalcTotal()" style="width:60px">';for(var bn=0;bn<=10;bn++)h+='<option value="'+bn+'">'+bn+'</option>';h+='</select></div><div class="rental-item"><span class="rental-label">シューズ(\xA51,500)</span><select id="sk-shoes'+i+'" onchange="skUpdateShoeSizes('+i+');skCalcTotal()" style="width:60px">';for(var sn=0;sn<=10;sn++)h+='<option value="'+sn+'">'+sn+'</option>';h+='</select></div><div id="sk-shoeSizes'+i+'"></div></div><div id="sk-slotSummary'+i+'"></div></div></div>'}c.innerHTML=h;skCalcTotal()}

function skApplyCopy(n){var ck=document.getElementById('sk-copy'+n).checked;['date','venue','time','level'].forEach(function(f){var inp=document.getElementById('sk-'+f+n);if(ck){inp.value=document.getElementById('sk-'+f+'1').value;inp.readOnly=true;inp.style.opacity='.5'}else{inp.readOnly=false;inp.style.opacity=''}})}
function skUpdateShoeSizes(s){var cnt=parseInt(document.getElementById('sk-shoes'+s).value)||0;var c=document.getElementById('sk-shoeSizes'+s);var h='';for(var n=1;n<=cnt;n++){h+='<div class="rental-item" style="padding-left:24px"><span style="font-size:12px;color:#86868b">'+n+'足目</span><select id="sk-shoesize'+s+'_'+n+'" style="width:80px"><option value="">選択</option>';for(var sz=26;sz<=29;sz+=0.5)h+='<option value="'+sz.toFixed(1)+'">'+sz.toFixed(1)+'cm</option>';h+='</select></div>'}c.innerHTML=h}
function skGetRentalTotal(i){return(parseInt(document.getElementById('sk-bib'+i).value)||0)*1000+(parseInt(document.getElementById('sk-ball'+i).value)||0)*500+(parseInt(document.getElementById('sk-shoes'+i).value)||0)*1500}
function skGetRentalLabels(i){var items=[];var bib=parseInt(document.getElementById('sk-bib'+i).value)||0;if(bib)items.push('ビブス'+bib+'(\xA5'+(bib*1000).toLocaleString()+')');var ball=parseInt(document.getElementById('sk-ball'+i).value)||0;if(ball)items.push('ボール'+ball+'(\xA5'+(ball*500).toLocaleString()+')');var shoes=parseInt(document.getElementById('sk-shoes'+i).value)||0;if(shoes){var sizes=[];for(var n=1;n<=shoes;n++){var el=document.getElementById('sk-shoesize'+i+'_'+n);if(el&&el.value)sizes.push(el.value+'cm')}items.push('シューズ'+shoes+(sizes.length?'('+sizes.join(',')+')':'')+' \xA5'+(shoes*1500).toLocaleString())}return items}
function skGetRentalData(i){var shoes=parseInt(document.getElementById('sk-shoes'+i).value)||0;var sizes=[];for(var n=1;n<=shoes;n++){var el=document.getElementById('sk-shoesize'+i+'_'+n);if(el&&el.value)sizes.push(el.value)}return{bibCount:parseInt(document.getElementById('sk-bib'+i).value)||0,ballCount:parseInt(document.getElementById('sk-ball'+i).value)||0,shoesCount:shoes,shoesSizes:sizes,rentalTotal:skGetRentalTotal(i),rentalLabels:skGetRentalLabels(i)}}
function skCalcTotal(){var grand=0,bh='';for(var i=1;i<=skSlotCount;i++){var p=parseInt((document.getElementById('sk-price'+i)||{}).value)||0;var d=parseInt((document.getElementById('sk-coupon'+i)||{}).value)||0;var r=skGetRentalTotal(i);var st=p-d+r;var se=document.getElementById('sk-slotSummary'+i);if(se&&p){var sh='<div class="slot-summary"><div class="summary-row"><span>金額</span><span>\xA5'+p.toLocaleString()+'</span></div>';if(d)sh+='<div class="summary-row discount"><span>クーポン</span><span>-\xA5'+d.toLocaleString()+'</span></div>';if(r){sh+='<div class="summary-row rental"><span>レンタル</span><span>+\xA5'+r.toLocaleString()+'</span></div>';var lb=skGetRentalLabels(i);if(lb.length)sh+='<div class="rental-detail">('+lb.join(' / ')+')</div>'}sh+='<div class="summary-total"><span>小計</span><span>\xA5'+st.toLocaleString()+'</span></div></div>';se.innerHTML=sh;bh+='<div class="gt-breakdown">予約'+i+': \xA5'+st.toLocaleString()+'</div>';grand+=st}else if(se)se.innerHTML=''}document.getElementById('sk-total-breakdown').innerHTML=bh;document.getElementById('sk-grand-total').textContent=grand?'\xA5'+grand.toLocaleString():'-'}

function showSokketsuConfirm(){var sn=document.getElementById('sk-staff-name').value.trim();if(!sn){alert('入力者名を入力');return}localStorage.setItem(LS_SK_STAFF,sn);for(var i=1;i<=skSlotCount;i++){if(!document.getElementById('sk-date'+i).value||!document.getElementById('sk-venue'+i).value.trim()||!document.getElementById('sk-time'+i).value.trim()||!document.getElementById('sk-level'+i).value.trim()||!document.getElementById('sk-price'+i).value){alert('予約'+i+'が未入力');return}}var b=selectedVenue.blocks[selectedBlockIndex];var t=b.teams[selectedTeamIndex];document.getElementById('sk-confirm-rep').textContent=t.rep||'-';document.getElementById('sk-confirm-email').textContent=t.email||'(なし)';var wd=['日','月','火','水','木','金','土'];var h='';for(var i=1;i<=skSlotCount;i++){var dv=document.getElementById('sk-date'+i).value;var dd=dv;try{var dt=new Date(dv);dd=(dt.getMonth()+1)+'/'+dt.getDate()+'('+wd[dt.getDay()]+')'}catch(e){}h+='<div class="confirm-section"><div class="confirm-item" style="font-size:15px;font-weight:600">'+dd+'</div><div class="confirm-item">'+esc(document.getElementById('sk-venue'+i).value)+'</div><div class="confirm-item">'+esc(document.getElementById('sk-time'+i).value)+' / '+esc(document.getElementById('sk-level'+i).value)+'</div></div>'}h+='<div style="text-align:center;font-size:22px;font-weight:700;padding:12px 0">'+document.getElementById('sk-grand-total').textContent+'</div>';document.getElementById('sokketsu-confirm-body').innerHTML=h;document.getElementById('sokketsu-confirm-overlay').classList.add('show')}
function closeSokketsuConfirm(){document.getElementById('sokketsu-confirm-overlay').classList.remove('show')}

async function doSubmitSokketsu(){if(isSending)return;isSending=true;var btn=document.getElementById('sokketsu-send-btn');btn.disabled=true;closeSokketsuConfirm();showLoading('送信中');var b=selectedVenue.blocks[selectedBlockIndex];var t=b.teams[selectedTeamIndex];var cl={'0':'なし','1000':'1,000円引き','2000':'2,000円引き','3000':'3,000円引き','4000':'4,000円引き','5000':'5,000円引き','8000':'8,000円引き'};var bks=[],grand=0,rg=0;for(var i=1;i<=skSlotCount;i++){var p=parseInt(document.getElementById('sk-price'+i).value)||0;var cv=document.getElementById('sk-coupon'+i).value;var d=parseInt(cv)||0;var sub=p-d;grand+=sub;var rental=skGetRentalData(i);rg+=rental.rentalTotal;bks.push({date:document.getElementById('sk-date'+i).value,venue:document.getElementById('sk-venue'+i).value,time:document.getElementById('sk-time'+i).value,level:document.getElementById('sk-level'+i).value,price:p,couponValue:cv,couponLabel:cl[cv]||'なし',discount:d,subtotal:sub,rental:rental})}var fd={staffName:document.getElementById('sk-staff-name').value,slotCount:skSlotCount,team:t.teamName,rep:t.rep||'',phone:t.phone||'',email:t.email||'',realEmail:t.realEmail||t.email||'',tournamentId:b.tournamentId||'',tournamentName:b.tournamentName||'',venue:selectedVenue.sheetName,bookings:bks,grandTotal:grand+rg,rentalGrandTotal:rg};try{var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(fd)});var res=await r.json();hideLoading();isSending=false;document.getElementById('done-title').textContent='予約完了';var msgs=[];if(res.cw==='OK')msgs.push('CWタスク作成済');if(res.email==='OK')msgs.push('メール送信済');document.getElementById('done-subtitle').textContent=msgs.join(' / ');var ee=document.getElementById('done-error');if(res.error){ee.textContent=res.error;ee.classList.remove('hidden')}else ee.classList.add('hidden');showScreen('screen-done')}catch(e){hideLoading();isSending=false;btn.disabled=false;alert(e.message)}}

function goReport(){renderReportForm();var saved=localStorage.getItem(LS_STAFF);if(saved)document.getElementById('report-staff-name').value=saved;showScreen('screen-report')}

function renderReportForm(){renderReportBlocks();renderStaff();var sa=selectedVenue.staffArea||{};document.getElementById('accident-report').value=sa.accidentReport||'';document.getElementById('other-report').value=sa.otherReport||'';document.getElementById('nw-start').value=sa.defaultStart||'09:00';document.getElementById('nw-end').value=sa.defaultEnd||'18:00';document.getElementById('nw-break').value=sa.defaultBreak||60;renderCheckItems()}

function renderReportBlocks(){var area=document.getElementById('report-blocks-area');var blocks=selectedVenue.blocks||[];if(!blocks.length){area.innerHTML='<p class="empty-state">大会なし</p>';return}area.innerHTML=blocks.map(function(b,bi){var teams=b.teams||[];var tp=[];if(b.startTime)tp.push(b.startTime);tp.push(b.tournamentName||'大会');return'<div style="margin-bottom:20px"><div style="font-size:15px;font-weight:600;margin-bottom:8px">'+esc(tp.join(' '))+'</div><div class="cancel-toggle-row"><label class="cancel-toggle"><input type="checkbox" id="rpt-cancel-'+bi+'" onchange="onReportCancelToggle('+bi+')"><span>中止</span></label></div><div id="rpt-teams-'+bi+'">'+teams.map(function(t,ti){var ss='width:100%;padding:8px;border:1px solid #d2d2d7;border-radius:6px;font-size:15px;font-family:inherit;background:#fff;color:#1d1d1f;-webkit-appearance:none';var so=[['','---'],['なし','なし'],['即決1','即決1'],['即決2','即決2'],['即決3','即決3'],['即決4','即決4'],['即決5','即決5']];var ro=[['','---'],['1位','1位'],['2位','2位'],['3位','3位'],['4位','4位'],['5位','5位'],['6位以下','6位以下']];var sh='<select id="rpt-sales-'+bi+'-'+ti+'" style="'+ss+'">'+so.map(function(o){return'<option value="'+esc(o[0])+'"'+(t.salesActivity===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';var rh='<select id="rpt-rank-'+bi+'-'+ti+'" style="'+ss+'">'+ro.map(function(o){return'<option value="'+esc(o[0])+'"'+(t.rank===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';return'<div style="padding:12px 0;border-bottom:.5px solid rgba(0,0,0,.06)"><div style="font-size:15px;font-weight:600;margin-bottom:8px">'+esc(t.teamName)+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px"><div><div style="font-size:11px;color:#86868b;margin-bottom:2px">営業</div>'+sh+'</div><div><div style="font-size:11px;color:#86868b;margin-bottom:2px">順位</div>'+rh+'</div></div><div><div style="font-size:11px;color:#86868b;margin-bottom:2px">備考</div><input type="text" id="rpt-remarks-'+bi+'-'+ti+'" value="'+esc(t.remarks||'')+'" placeholder="備考" style="'+ss+'"></div></div>'}).join('')+'</div></div>'}).join('')}

function onReportCancelToggle(bi){document.getElementById('rpt-teams-'+bi).classList.toggle('teams-disabled',document.getElementById('rpt-cancel-'+bi).checked)}

function renderStaff(){var sa=selectedVenue.staffArea||{};var ml=(venueData.memberList&&venueData.memberList.length)?venueData.memberList:(selectedVenue.memberList||[]);var area=document.getElementById('staff-area');var slots=sa.staff||[];var display=[];for(var i=0;i<13;i++)display.push(slots[i]||{row:0,name:'',checkIn:'',checkOut:'',breakMin:0});var oh='<option value="">--</option>';ml.forEach(function(n){oh+='<option value="'+esc(n)+'">'+esc(n)+'</option>'});area.innerHTML=display.map(function(s,i){var hn=s.name&&s.name.trim();return'<div class="staff-row" id="se-'+i+'"><div class="staff-num">'+(i+1)+'</div><select id="sn-'+i+'" onchange="onStaffNameChange('+i+')">'+oh+'</select><label class="nw-toggle"><input type="checkbox" id="snw-'+i+'" onchange="onNormalWorkToggle('+i+')"><span class="sw"></span></label></div><div class="staff-times '+(hn?'':'collapsed')+'" id="sr-'+i+'"><div><div class="st-label">出勤</div><input type="time" id="sci-'+i+'" value="'+esc(s.checkIn||'')+'"></div><div><div class="st-label">退勤</div><input type="time" id="sco-'+i+'" value="'+esc(s.checkOut||'')+'"></div><div><div class="st-label">休憩</div><input type="number" id="sb-'+i+'" value="'+(s.breakMin||'')+'" min="0" step="15"></div></div>'}).join('');display.forEach(function(s,i){if(s.name){var sel=document.getElementById('sn-'+i);sel.value=s.name;if(sel.value!==s.name){var opt=document.createElement('option');opt.value=s.name;opt.textContent=s.name;sel.appendChild(opt);sel.value=s.name}}})}

function onStaffNameChange(idx){var hn=document.getElementById('sn-'+idx).value.trim()!=='';document.getElementById('sr-'+idx).classList.toggle('collapsed',!hn)}
function onNormalWorkToggle(idx){var cb=document.getElementById('snw-'+idx);var ci=document.getElementById('sci-'+idx),co=document.getElementById('sco-'+idx),sb=document.getElementById('sb-'+idx);if(cb.checked){ci.value=document.getElementById('nw-start').value;co.value=document.getElementById('nw-end').value;sb.value=document.getElementById('nw-break').value;ci.disabled=co.disabled=sb.disabled=true}else{ci.disabled=co.disabled=sb.disabled=false}}
function applyAllNormal(){for(var i=0;i<13;i++){var sel=document.getElementById('sn-'+i);if(sel&&sel.value.trim()){document.getElementById('snw-'+i).checked=true;onNormalWorkToggle(i);document.getElementById('sr-'+i).classList.remove('collapsed')}}}
function renderCheckItems(){var sa=selectedVenue.staffArea||{};var items=sa.checkItems||[];var area=document.getElementById('check-items-area');if(!items.length){area.innerHTML='<p class="empty-state">チェック項目なし</p>';return}area.innerHTML=items.map(function(item,i){return'<div class="check-item"><input type="checkbox" id="chk-'+i+'" '+(item.checked?'checked':'')+'><label for="chk-'+i+'">'+esc(item.text)+'</label></div>'}).join('')}

function showReportConfirm(){if(isSending)return;var sn=document.getElementById('report-staff-name').value.trim();if(!sn){alert('報告者名を入力');document.getElementById('report-staff-name').focus();return}localStorage.setItem(LS_STAFF,sn);var errors=[];var blocks=selectedVenue.blocks||[];blocks.forEach(function(b,bi){if(document.getElementById('rpt-cancel-'+bi).checked)return;(b.teams||[]).forEach(function(t,ti){if(!document.getElementById('rpt-sales-'+bi+'-'+ti).value)errors.push(t.teamName+' 営業未選択')})});var sa=selectedVenue.staffArea||{};var ci=sa.checkItems||[];var uc=0;ci.forEach(function(item,i){if(!document.getElementById('chk-'+i).checked)uc++});if(uc)errors.push(uc+'件未チェック');if(errors.length){alert(errors.join('\n'));return}var h='<div class="confirm-section"><div class="confirm-section-title">報告者</div><div class="confirm-item">'+esc(sn)+'</div></div>';blocks.forEach(function(b,bi){var tl=(b.teams||[]).map(function(t,ti){var s=document.getElementById('rpt-sales-'+bi+'-'+ti).value;var r=document.getElementById('rpt-rank-'+bi+'-'+ti).value;return'<div class="confirm-item">'+esc(t.teamName)+' '+esc(s)+' '+esc(r)+'</div>'}).join('');h+='<div class="confirm-section"><div class="confirm-section-title">'+esc(b.tournamentName||'')+'</div>'+tl+'</div>'});document.getElementById('report-confirm-body').innerHTML=h;document.getElementById('report-confirm-overlay').classList.add('show')}
function closeReportConfirm(){document.getElementById('report-confirm-overlay').classList.remove('show')}

async function doSubmitReport(){if(isSending)return;isSending=true;document.getElementById('report-send-btn').disabled=true;closeReportConfirm();showLoading('送信中');var blocks=selectedVenue.blocks||[];var teams=[];blocks.forEach(function(b,bi){(b.teams||[]).forEach(function(t,ti){teams.push({teamRow:t.teamRow,salesActivity:document.getElementById('rpt-sales-'+bi+'-'+ti).value,rank:document.getElementById('rpt-rank-'+bi+'-'+ti).value,remarks:document.getElementById('rpt-remarks-'+bi+'-'+ti).value})})});var staffList=[];var sa=selectedVenue.staffArea||{};var slots=sa.staff||[];for(var i=0;i<13;i++){var name=document.getElementById('sn-'+i).value.trim();var row=(slots[i]&&slots[i].row)?slots[i].row:(390+i);staffList.push({row:row,name:name,checkIn:document.getElementById('sci-'+i).value,checkOut:document.getElementById('sco-'+i).value,breakMin:parseInt(document.getElementById('sb-'+i).value)||0,normalWork:document.getElementById('snw-'+i).checked})}var checkItems=(sa.checkItems||[]).map(function(item,i){return{row:item.row,checked:document.getElementById('chk-'+i).checked}});var payload={action:'submitReport',staffName:document.getElementById('report-staff-name').value.trim(),spreadsheetId:selectedVenue.spreadsheetId,sheetName:selectedVenue.sheetName,teams:teams,staffList:staffList,accidentReport:document.getElementById('accident-report').value.trim(),otherReport:document.getElementById('other-report').value.trim(),checkItems:checkItems,markComplete:true};try{var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});var res=await r.json();hideLoading();isSending=false;document.getElementById('done-title').textContent='報告完了';document.getElementById('done-subtitle').textContent=selectedVenue.sheetName;var ee=document.getElementById('done-error');if(res.error){ee.textContent=res.error;ee.classList.remove('hidden')}else ee.classList.add('hidden');showScreen('screen-done')}catch(e){hideLoading();isSending=false;document.getElementById('report-send-btn').disabled=false;alert(e.message)}}

function showLoading(m){document.getElementById('loading-text').textContent=m||'';var el=document.getElementById('loading-overlay');el.classList.remove('hidden');el.style.opacity='1'}
function hideLoading(){document.getElementById('loading-overlay').classList.add('hidden')}
function showError(m){var el=document.getElementById('error-banner');el.textContent=m;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},5000)}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function fmtPhone(p){if(!p)return'';var s=String(p).replace(/[^0-9]/g,'');if(s&&s.charAt(0)!=='0')s='0'+s;return s}
function phoneLink(p){var n=fmtPhone(p);if(!n)return'-';return'<a href="tel:'+n+'" style="color:#007aff;text-decoration:none;font-weight:500" onclick="event.stopPropagation()">'+esc(n)+'</a>'}
</script>
</body>
