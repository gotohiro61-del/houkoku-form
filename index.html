<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>完了報告システム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 40px;
  }

  /* Loading overlay */
  #loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fff;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
  }
  #loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #e0e0e0;
    border-top-color: #2980b9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    margin-top: 16px;
    font-size: 14px;
    color: #888;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a5276, #2980b9);
    color: white;
    padding: 18px 16px;
    border-radius: 14px;
    margin-bottom: 14px;
    text-align: center;
  }
  .header h1 { font-size: 17px; font-weight: 700; }
  .header .badge {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    margin-top: 6px;
  }

  /* Steps indicator */
  .steps {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .step-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ddd;
    transition: all 0.3s;
  }
  .step-dot.active { background: #2980b9; width: 28px; border-radius: 5px; }

  /* Section */
  .section {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: #1a5276;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding-bottom: 8px;
    border-bottom: 2px solid #e0edf5;
  }

  /* Form */
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #444;
    margin-bottom: 6px;
  }
  .form-group label .req {
    color: #d32f2f;
    font-size: 11px;
    margin-left: 4px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    background: #fafafa;
    transition: border-color 0.2s, background 0.2s;
    -webkit-appearance: none;
    font-family: inherit;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #2980b9;
    background: white;
  }
  .form-group textarea {
    resize: vertical;
    min-height: 80px;
  }

  /* Venue card */
  .venue-card {
    background: white;
    border: 2px solid #e8eaed;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .venue-card:active { background: #f0f4ff; }
  .venue-card.selected {
    border-color: #2980b9;
    background: #e0edf5;
    box-shadow: 0 0 0 3px rgba(41,128,185,0.15);
  }
  .venue-card .venue-info { flex: 1; }
  .venue-card .venue-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .venue-card .venue-meta {
    font-size: 13px;
    color: #666;
  }
  .venue-card .venue-status {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .venue-card .venue-status.done {
    background: #e8f5e9;
    color: #2e7d32;
  }

  /* Accordion */
  .accordion {
    border: 2px solid #e8eaed;
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .accordion-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: #f0f4f8;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .accordion-header:active { background: #e4eaf0; }
  .accordion-header .acc-title {
    font-size: 14px;
    font-weight: 700;
    color: #1a5276;
  }
  .accordion-header .acc-sub {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }
  .accordion-header .acc-arrow {
    font-size: 18px;
    color: #999;
    transition: transform 0.2s;
  }
  .accordion.open .acc-arrow { transform: rotate(180deg); }
  .accordion-body {
    display: none;
    padding: 12px 14px;
    background: #fff;
  }
  .accordion.open .accordion-body { display: block; }

  /* Team card inside accordion */
  .team-entry {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    background: #fafbfc;
  }
  .team-entry:last-child { margin-bottom: 0; }
  .team-entry .team-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .team-entry .team-name {
    font-size: 15px;
    font-weight: 700;
    color: #333;
  }
  .team-entry .team-app-no {
    font-size: 12px;
    color: #999;
  }
  .team-entry .team-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .team-entry .team-fields .full-width {
    grid-column: 1 / -1;
  }
  .team-entry .field-label {
    font-size: 11px;
    font-weight: 700;
    color: #666;
    margin-bottom: 4px;
  }
  .team-entry select,
  .team-entry input {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    -webkit-appearance: none;
    font-family: inherit;
  }
  .team-entry select:focus,
  .team-entry input:focus {
    outline: none;
    border-color: #2980b9;
  }

  /* Staff section */
  .staff-defaults {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .staff-defaults .default-tag {
    background: #e0edf5;
    color: #1a5276;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .apply-defaults-btn {
    width: 100%;
    padding: 12px;
    background: #e0edf5;
    color: #1a5276;
    border: 2px solid #b0cfe0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
    transition: background 0.2s;
  }
  .apply-defaults-btn:active { background: #c8dded; }

  .staff-entry {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #fafbfc;
  }
  .staff-entry .staff-row-top {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 6px;
    align-items: center;
  }
  .staff-entry .staff-num {
    font-size: 12px;
    font-weight: 700;
    color: #999;
    text-align: center;
  }
  .staff-entry .staff-row-bottom {
    display: grid;
    grid-template-columns: 1fr 1fr 70px;
    gap: 6px;
  }
  .staff-entry input {
    width: 100%;
    padding: 8px 8px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    -webkit-appearance: none;
    font-family: inherit;
  }
  .staff-entry input:focus {
    outline: none;
    border-color: #2980b9;
  }
  .staff-entry input[type="time"] { font-size: 14px; }
  .staff-entry input[type="number"] { font-size: 14px; }
  .staff-field-label {
    font-size: 10px;
    color: #999;
    margin-bottom: 2px;
  }

  /* Report textarea section */
  .report-section {
    background: #f0f4f8;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .report-section .section-title {
    border-bottom-color: #d0dde8;
  }

  /* Submit button - red */
  .submit-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
    letter-spacing: 1px;
  }
  .submit-btn:active { opacity: 0.8; transform: scale(0.98); }
  .submit-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
  }

  .back-btn {
    width: 100%;
    padding: 14px;
    background: white;
    color: #999;
    border: 2px solid #e0e0e0;
    border-radius: 14px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }
  .back-btn:active { background: #f5f5f5; }

  /* Confirm overlay */
  #confirm-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 9000;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  #confirm-overlay.show { display: flex; }
  .confirm-sheet {
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 24px 16px 32px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .confirm-title {
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 16px;
    color: #1a5276;
  }
  .confirm-section {
    background: #f0f4f8;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .confirm-section-title {
    font-size: 13px;
    font-weight: 700;
    color: #1a5276;
    margin-bottom: 6px;
  }
  .confirm-item {
    font-size: 13px;
    padding: 3px 0;
    color: #555;
  }
  .confirm-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .confirm-back-btn {
    padding: 16px;
    background: white;
    color: #666;
    border: 2px solid #e0e0e0;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .confirm-send-btn {
    padding: 16px;
    background: linear-gradient(135deg, #c0392b, #e74c3c);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .confirm-send-btn:active { opacity: 0.8; }

  /* Done screen */
  #done-screen {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }
  #done-screen.show { display: block; }
  .done-check {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 40px;
    color: white;
  }
  .done-title {
    font-size: 22px;
    font-weight: 700;
    color: #333;
    margin-bottom: 8px;
  }
  .done-subtitle {
    font-size: 14px;
    color: #888;
  }
  .done-error {
    background: #fdecea;
    border-radius: 10px;
    padding: 12px;
    margin-top: 16px;
    color: #c0392b;
    font-size: 13px;
  }

  /* Error banner */
  .error-banner {
    background: #fdecea;
    color: #c0392b;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 13px;
    display: none;
  }
  .error-banner.show { display: block; }

  /* Utility */
  .hidden { display: none !important; }
  .mt-8 { margin-top: 8px; }
  .mb-12 { margin-bottom: 12px; }
  .text-center { text-align: center; }
  .text-sm { font-size: 13px; color: #888; }
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">データを取得中...</div>
</div>

<!-- Confirm overlay -->
<div id="confirm-overlay">
  <div class="confirm-sheet">
    <div class="confirm-title">送信内容の確認</div>
    <div id="confirm-body"></div>
    <div class="confirm-buttons">
      <button class="confirm-back-btn" onclick="closeConfirm()">戻って修正</button>
      <button class="confirm-send-btn" onclick="doSubmit()">送信する</button>
    </div>
  </div>
</div>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>完了報告システム</h1>
    <div class="badge" id="today-display">-</div>
  </div>

  <!-- Steps -->
  <div class="steps" id="step-dots">
    <div class="step-dot active"></div>
    <div class="step-dot"></div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="error-banner"></div>

  <!-- ===== Step 1: Venue Selection ===== -->
  <div id="step1">
    <div class="section">
      <div class="section-title">&#x1F4CB; 入力者</div>
      <div class="form-group">
        <label>お名前 <span class="req">*必須</span></label>
        <input type="text" id="staff-name" placeholder="例: 後藤">
      </div>
    </div>

    <div class="section">
      <div class="section-title">&#x1F3DF; 会場選択</div>
      <div id="venue-list">
        <p class="text-sm text-center">データを読み込み中...</p>
      </div>
    </div>
  </div>

  <!-- ===== Step 2: Report Input ===== -->
  <div id="step2" class="hidden">
    <!-- Back to venue select -->
    <button class="back-btn mb-12" onclick="goStep1()" id="back-to-venues-btn">&#x2190; 会場選択に戻る</button>

    <!-- Section 1: Team reports -->
    <div class="section">
      <div class="section-title">&#x1F3C0; チーム報告</div>
      <div id="blocks-area"></div>
    </div>

    <!-- Section 2: Staff attendance -->
    <div class="section">
      <div class="section-title">&#x1F464; スタッフ勤務</div>
      <div class="staff-defaults" id="staff-defaults"></div>
      <button class="apply-defaults-btn" onclick="applyDefaults()">デフォルト時間を適用</button>
      <div id="staff-area"></div>
    </div>

    <!-- Section 3: Field reports -->
    <div class="report-section">
      <div class="section-title">&#x1F4DD; 現場報告</div>
      <div class="form-group">
        <label>アクシデント報告</label>
        <textarea id="accident-report" placeholder="事故・怪我・トラブル等あれば記入"></textarea>
      </div>
      <div class="form-group">
        <label>その他報告</label>
        <textarea id="other-report" placeholder="連絡事項など"></textarea>
      </div>
    </div>

    <!-- Submit -->
    <button class="submit-btn" onclick="showConfirm()">完了報告を送信</button>
  </div>

  <!-- ===== Done Screen ===== -->
  <div id="done-screen">
    <div class="done-check">&#x2713;</div>
    <div class="done-title">報告完了</div>
    <div class="done-subtitle">完了報告が送信されました</div>
    <div class="done-error hidden" id="done-error"></div>
  </div>
</div>

<script>
// ========== Config ==========
const API_URL = 'https://script.google.com/macros/s/AKfycbzejwlaQBa4v1sWbDhWhiSHDt3ydAhyydu_3sLqFTVYaP2PY3de4fVxCfA1JNVgYOSX/exec';
const LS_KEY = 'houkoku_staff';

// ========== State ==========
let venueData = null;       // full GET response
let selectedVenue = null;   // chosen venue object
let selectedIndex = -1;     // chosen venue index
let isSending = false;

// ========== Init ==========
document.addEventListener('DOMContentLoaded', () => {
  // Restore staff name
  const saved = localStorage.getItem(LS_KEY);
  if (saved) document.getElementById('staff-name').value = saved;

  loadData();
});

async function loadData() {
  showLoading('データを取得中...');
  try {
    const res = await fetch(API_URL + '?action=getVenueReport');
    const data = await res.json();
    venueData = data;
    document.getElementById('today-display').textContent = data.todayDisplay || '';
    renderVenueList(data.venues || []);

    // Auto-select if only one venue
    if (data.venues && data.venues.length === 1) {
      selectVenue(0);
    }
  } catch (e) {
    showError('データの取得に失敗しました: ' + e.message);
    document.getElementById('venue-list').innerHTML = '<p class="text-sm text-center" style="color:#c0392b;">取得失敗。リロードしてください。</p>';
  } finally {
    hideLoading();
  }
}

// ========== Venue List ==========
function renderVenueList(venues) {
  const el = document.getElementById('venue-list');
  if (!venues.length) {
    el.innerHTML = '<p class="text-sm text-center">本日の会場データがありません</p>';
    return;
  }
  el.innerHTML = venues.map((v, i) => {
    const blockCount = (v.blocks || []).length;
    const isDone = v.staffArea && v.staffArea.completionCheck;
    return `
      <div class="venue-card" onclick="selectVenue(${i})" id="vc-${i}">
        <div class="venue-info">
          <div class="venue-name">${esc(v.sheetName)}</div>
          <div class="venue-meta">${blockCount} ブロック</div>
        </div>
        ${isDone ? '<div class="venue-status done">登録済</div>' : ''}
      </div>`;
  }).join('');
}

function selectVenue(idx) {
  const name = document.getElementById('staff-name').value.trim();
  if (!name) {
    alert('入力者名を入力してください');
    document.getElementById('staff-name').focus();
    return;
  }
  localStorage.setItem(LS_KEY, name);

  selectedIndex = idx;
  selectedVenue = venueData.venues[idx];
  goStep2();
}

// ========== Step Navigation ==========
function goStep1() {
  document.getElementById('step1').classList.remove('hidden');
  document.getElementById('step2').classList.add('hidden');
  updateDots(0);
}

function goStep2() {
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');

  // Hide back button if auto-selected (single venue)
  if (venueData.venues.length === 1) {
    document.getElementById('back-to-venues-btn').classList.add('hidden');
  } else {
    document.getElementById('back-to-venues-btn').classList.remove('hidden');
  }

  updateDots(1);
  renderStep2();
  window.scrollTo(0, 0);
}

function updateDots(step) {
  const dots = document.querySelectorAll('#step-dots .step-dot');
  dots.forEach((d, i) => {
    d.classList.toggle('active', i === step);
  });
}

// ========== Render Step 2 ==========
function renderStep2() {
  renderBlocks();
  renderStaff();
  // Prefill reports
  const sa = selectedVenue.staffArea || {};
  document.getElementById('accident-report').value = sa.accidentReport || '';
  document.getElementById('other-report').value = sa.otherReport || '';
}

// ----- Blocks / Teams -----
function renderBlocks() {
  const area = document.getElementById('blocks-area');
  const blocks = selectedVenue.blocks || [];
  if (!blocks.length) {
    area.innerHTML = '<p class="text-sm">ブロックデータがありません</p>';
    return;
  }
  area.innerHTML = blocks.map((b, bi) => {
    const isOpen = bi === 0;
    const teams = b.teams || [];
    return `
      <div class="accordion ${isOpen ? 'open' : ''}" id="acc-${bi}">
        <div class="accordion-header" onclick="toggleAccordion(${bi})">
          <div>
            <div class="acc-title">${esc(b.tournamentName || 'ブロック ' + (bi + 1))}</div>
            <div class="acc-sub">${esc(b.tournamentId || '')} / ${teams.length}チーム</div>
          </div>
          <div class="acc-arrow">&#x25BC;</div>
        </div>
        <div class="accordion-body">
          ${teams.map((t, ti) => renderTeamEntry(bi, ti, t)).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderTeamEntry(bi, ti, t) {
  const salesOptions = ['', '◯', '×', '延期', '済'];
  const rankOptions = ['', '優勝', '準優勝', '3位', '4位', '5位', '6位以下'];
  return `
    <div class="team-entry">
      <div class="team-header">
        <div class="team-name">${esc(t.teamName)}</div>
        <div class="team-app-no">#${esc(t.applicationNo || '')}</div>
      </div>
      <div class="team-fields">
        <div>
          <div class="field-label">営業活動</div>
          <select id="sales-${bi}-${ti}">
            ${salesOptions.map(o => `<option value="${esc(o)}" ${t.salesActivity === o ? 'selected' : ''}>${o || '---'}</option>`).join('')}
          </select>
        </div>
        <div>
          <div class="field-label">順位</div>
          <select id="rank-${bi}-${ti}">
            ${rankOptions.map(o => `<option value="${esc(o)}" ${t.rank === o ? 'selected' : ''}>${o || '---'}</option>`).join('')}
          </select>
        </div>
        <div class="full-width">
          <div class="field-label">備考</div>
          <input type="text" id="remarks-${bi}-${ti}" value="${esc(t.remarks || '')}" placeholder="備考">
        </div>
      </div>
    </div>`;
}

function toggleAccordion(bi) {
  document.getElementById('acc-' + bi).classList.toggle('open');
}

// ----- Staff -----
function renderStaff() {
  const sa = selectedVenue.staffArea || {};
  const defEl = document.getElementById('staff-defaults');
  defEl.innerHTML = `
    <div class="default-tag">出勤: ${sa.defaultStart || '09:00'}</div>
    <div class="default-tag">退勤: ${sa.defaultEnd || '18:00'}</div>
    <div class="default-tag">休憩: ${sa.defaultBreak || 60}分</div>`;

  const area = document.getElementById('staff-area');
  const slots = sa.staffSlots || [];
  // Ensure 13 slots
  const maxSlots = 13;
  const display = [];
  for (let i = 0; i < maxSlots; i++) {
    display.push(slots[i] || { row: 0, name: '', checkIn: '', checkOut: '', breakMin: 0 });
  }

  area.innerHTML = display.map((s, i) => `
    <div class="staff-entry">
      <div class="staff-row-top">
        <div class="staff-num">${i + 1}</div>
        <div>
          <div class="staff-field-label">名前</div>
          <input type="text" id="sn-${i}" value="${esc(s.name || '')}" placeholder="名前">
        </div>
      </div>
      <div class="staff-row-bottom">
        <div>
          <div class="staff-field-label">出勤</div>
          <input type="time" id="sci-${i}" value="${esc(s.checkIn || '')}">
        </div>
        <div>
          <div class="staff-field-label">退勤</div>
          <input type="time" id="sco-${i}" value="${esc(s.checkOut || '')}">
        </div>
        <div>
          <div class="staff-field-label">休憩</div>
          <input type="number" id="sb-${i}" value="${s.breakMin || ''}" placeholder="分" min="0" step="15">
        </div>
      </div>
    </div>`).join('');
}

function applyDefaults() {
  const sa = selectedVenue.staffArea || {};
  const defStart = sa.defaultStart || '09:00';
  const defEnd = sa.defaultEnd || '18:00';
  const defBreak = sa.defaultBreak || 60;
  for (let i = 0; i < 13; i++) {
    const nameEl = document.getElementById('sn-' + i);
    if (nameEl && nameEl.value.trim()) {
      document.getElementById('sci-' + i).value = defStart;
      document.getElementById('sco-' + i).value = defEnd;
      document.getElementById('sb-' + i).value = defBreak;
    }
  }
}

// ========== Confirm ==========
function showConfirm() {
  if (isSending) return;
  const body = document.getElementById('confirm-body');
  let html = '';

  // Staff
  const staffName = document.getElementById('staff-name').value.trim();
  html += `<div class="confirm-section">
    <div class="confirm-section-title">入力者</div>
    <div class="confirm-item">${esc(staffName)}</div>
    <div class="confirm-item">会場: ${esc(selectedVenue.sheetName)}</div>
  </div>`;

  // Teams summary
  const blocks = selectedVenue.blocks || [];
  blocks.forEach((b, bi) => {
    const teams = b.teams || [];
    const teamLines = teams.map((t, ti) => {
      const sales = document.getElementById('sales-' + bi + '-' + ti).value;
      const rank = document.getElementById('rank-' + bi + '-' + ti).value;
      const remarks = document.getElementById('remarks-' + bi + '-' + ti).value;
      let parts = [esc(t.teamName)];
      if (sales) parts.push('営業:' + esc(sales));
      if (rank) parts.push('順位:' + esc(rank));
      if (remarks) parts.push('備考:' + esc(remarks));
      return `<div class="confirm-item">${parts.join(' / ')}</div>`;
    }).join('');

    html += `<div class="confirm-section">
      <div class="confirm-section-title">${esc(b.tournamentName || 'ブロック ' + (bi + 1))}</div>
      ${teamLines}
    </div>`;
  });

  // Staff summary
  let staffLines = '';
  for (let i = 0; i < 13; i++) {
    const n = document.getElementById('sn-' + i).value.trim();
    if (!n) continue;
    const ci = document.getElementById('sci-' + i).value;
    const co = document.getElementById('sco-' + i).value;
    const br = document.getElementById('sb-' + i).value;
    staffLines += `<div class="confirm-item">${esc(n)} ${ci}-${co} 休憩${br || 0}分</div>`;
  }
  if (staffLines) {
    html += `<div class="confirm-section">
      <div class="confirm-section-title">スタッフ勤務</div>
      ${staffLines}
    </div>`;
  }

  // Reports
  const acc = document.getElementById('accident-report').value.trim();
  const other = document.getElementById('other-report').value.trim();
  if (acc || other) {
    html += `<div class="confirm-section">
      <div class="confirm-section-title">現場報告</div>
      ${acc ? '<div class="confirm-item">アクシデント: ' + esc(acc) + '</div>' : ''}
      ${other ? '<div class="confirm-item">その他: ' + esc(other) + '</div>' : ''}
    </div>`;
  }

  body.innerHTML = html;
  document.getElementById('confirm-overlay').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
}

// ========== Submit ==========
async function doSubmit() {
  if (isSending) return;
  isSending = true;
  closeConfirm();
  showLoading('送信中...');

  try {
    const payload = buildPayload();
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if (result.error) {
      showDone(result.error);
    } else {
      showDone(null);
    }
  } catch (e) {
    showDone('送信エラー: ' + e.message);
  } finally {
    isSending = false;
    hideLoading();
  }
}

function buildPayload() {
  const blocks = selectedVenue.blocks || [];
  const teams = [];
  blocks.forEach((b, bi) => {
    (b.teams || []).forEach((t, ti) => {
      teams.push({
        teamRow: t.teamRow,
        salesActivity: document.getElementById('sales-' + bi + '-' + ti).value,
        rank: document.getElementById('rank-' + bi + '-' + ti).value,
        remarks: document.getElementById('remarks-' + bi + '-' + ti).value
      });
    });
  });

  const staffList = [];
  const sa = selectedVenue.staffArea || {};
  const slots = sa.staffSlots || [];
  for (let i = 0; i < 13; i++) {
    const name = document.getElementById('sn-' + i).value.trim();
    const row = (slots[i] && slots[i].row) ? slots[i].row : (390 + i);
    staffList.push({
      row: row,
      name: name,
      checkIn: document.getElementById('sci-' + i).value,
      checkOut: document.getElementById('sco-' + i).value,
      breakMin: parseInt(document.getElementById('sb-' + i).value) || 0
    });
  }

  return {
    action: 'submitReport',
    staffName: document.getElementById('staff-name').value.trim(),
    spreadsheetId: selectedVenue.spreadsheetId,
    sheetName: selectedVenue.sheetName,
    teams: teams,
    staffList: staffList,
    accidentReport: document.getElementById('accident-report').value.trim(),
    otherReport: document.getElementById('other-report').value.trim(),
    markComplete: true
  };
}

// ========== Done Screen ==========
function showDone(errorMsg) {
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.add('hidden');
  document.getElementById('step-dots').classList.add('hidden');

  const doneEl = document.getElementById('done-screen');
  doneEl.classList.add('show');

  const errEl = document.getElementById('done-error');
  if (errorMsg) {
    errEl.textContent = errorMsg;
    errEl.classList.remove('hidden');
  } else {
    errEl.classList.add('hidden');
  }
}

// ========== Loading ==========
function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg || '';
  const el = document.getElementById('loading-overlay');
  el.classList.remove('hidden');
  el.style.opacity = '1';
}
function hideLoading() {
  const el = document.getElementById('loading-overlay');
  el.classList.add('hidden');
}

// ========== Error ==========
function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

// ========== Util ==========
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
</script>
